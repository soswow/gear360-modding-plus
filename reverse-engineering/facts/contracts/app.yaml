# The minimal camera app on the camera itself. Its own behaviour, the
# library it drives and the files it writes. Addresses in app are
# linux-capture-elf unless a claim says otherwise.

claims:
  - id: app.first-camera-capture-with-raw-dng-and-exif-jpeg-20261105
    status: accepted
    kind: runtime
    statement: >
      On boot 1793844742 the camera app was launched on the same boot with the
      stock service inactive and MainPID 0; no service was started, no
      firmware was written and the camera was not power-cycled. Storage
      initialized and created photos/, state/counter.0, state/counter.1 (20
      bytes each), state/storage.lock and the capture library's
      state/capture.log. The library reported mm_camera_create succeeded,
      the bridge alive and open: ready. The user pressed Capture once and
      confirmed seeing CAPTURING... and READY on the screen. The app wrote
      20261105-125537-00001.dng (33,733,196 bytes) and
      20261105-125537-00001.jpg (4,729,708 bytes) and returned to READY; the
      counter slot advanced to 1. On the host the DNG passes
      exiftool -validate with no warning and carries SAMSUNG/SM-R210,
      5824x2896, 16-bit, GRBG, ColorMatrix1, AsShotNeutral, WhiteLevel 65472
      and BlackLevel 4106. The JPEG carries the Exif profile (SAMSUNG/SM-R210,
      software g360cap, 1/100 s, ISO 125, Program AE, F2.2, sRGB, Auto white
      balance, date 2026:11:05 12:55:37) and the Samsung Type 2 MakerNote
      with AWB, AE and colour records, which stock_iq.py decodes from the
      file. Rebuilding the DNG with make_dng.py from the RAW samples and this
      shot's own IQ records gives a byte-for-byte identical file.
    address_space: linux-capture-elf
    also_involves: [physical]
    evidence:
      - reverse-engineering/camera-app-20261105-evidence.json
      - src/app/VALIDATION.md
      - src/app/tools/verify-shot.py
    not_proven:
      - the fresh-boot path; validated later in
        app.fresh-boot-flow-two-shots-20261105
      - how the controls behave during a RAW capture, or what the app does
        with the Power hold
      - Menu or Power actions in the app
    detail: src/app/VALIDATION.md

  - id: app.fresh-boot-flow-two-shots-20261105
    status: accepted
    kind: runtime
    statement: >
      After a normal reboot (boot 1793849521) the user double-pressed Power
      and the launcher logged launch mode=fresh with executable ab627b29...;
