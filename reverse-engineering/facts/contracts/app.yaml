  - id: app.stock-poweroff-sequence-20261105
    status: accepted
    kind: static
    statement: >
      The stock app's power-off ends in CAPPPowerOffMode::powerOffSystemShutdown
      (0xba534): setDevicePowerShutdown(1) at 0xbacf4, which is
      device_set_property(4, 0x15, 1); deviceRequestPowerOff at 0xbaee8, which
      is deviced_request_power_off(); then setDevicePowerSuspend, which is
      device_set_property(4, 4, 0), either directly (0xbb868) or at the end of
      the power-off LED thread (0xb9b7c). Before it, powerOffSystemShutdownMode
      runs saveValueAndEndMMPkg (RTOS PowerSave(1) and the PowerOff wait unless
      the lens is in error). In libdevice-node, device 4 ("power", 0x1f11c)
      has a Thumb setter at 0x14384 whose jump table sends property 4 to
      plugin slot +0x15c and property 0x15 to slot +0x460, passing the value;
      the devman plugin's interface table (0x2a260) has
      OEM_sys_set_power_state at +0x15c and OEM_sys_set_power_shutdown at
      +0x460. OEM_sys_set_power_shutdown(v) writes v to
      /sys/devices/platform/d5-keys/shutdown; OEM_sys_set_power_state(0)
      writes 2 there. deviced_request_power_off is a blocking system-bus call
      of org.tizen.system.deviced.core.PowerOff on
      /Org/Tizen/System/DeviceD/Core with an int32 reply. deviced acts on it
      only in state 1 (set by BootingDone), then sets state 2, and runs its
      type-1 notifiers: uevent stop, card uevent stop, sync and card unmount,
      USB off, battery timers off. Its card unmount is forced: when busy it
      runs /sbin/fuser -m -k -SIGTERM on /opt/storage/sdcard, then -SIGKILL
      5 s later, then a lazy unmount. In the kernel, the d5-keys shutdown
      store (0xc0392240) parses the value and, for 2, calls the pointer at
      0xc07b9d8c, which board init sets to 0xc001e048: the board power-off,
      which reboots instead only when the 1shot value is 1 or 9, and
      otherwise switches the power chip off. A value of 1 is only stored.
    address_space: linux-app-elf
    also_involves: [linux-device-node-elf, linux-kernel]
    evidence:
      - ev_fb02639c211eadbcbb84021bd2706a05d73267790d72c8c422b2b4c3533c6b97
      - ev_e9c2d4d04d237f24f89f1ffa851db024e458a53cc9c55e8391b8bae2c29893ef
      - ev_efcb8380d10e249145560777631e6f94128a01a7ef27ec4395225014f3981260
      - ev_d0c70f3779aaf653d3c4a521b616157efa69acae243b6e6f7fef26ef1852f183
      - ev_b6794cda077e261af1aefd92e9a2c43cf27be23232209b3eb1cf98df21567550
      - ev_83adb96860eecf7756bb17579a0f437e7034c0f1e86ee49018ce511d3038461d
      - ev_a992e44fe96e731a4966f0a05da9a47dfc04d9901e76b28714bdce575668b1b3
      - ev_38d34487aa9b41f3775add378b3a0abe96493b2fb0826df6c3e0130d90ca7bcb
      - ev_91dacc252c0567fd08326d6099c2869ed02d439c52948aae396d8e91dfc63765
      - ev_109dac92150d933d31363a7e5f38f3dd3fbf76e3a4d61bbb3a4d8fcfe79d6da1
      - ev_829c550d2cbeea13f426c56e6962d5c827d0beba738635e0a1112ce7a6126437
      - ev_181180749d440a1d228e497fd8f5c12a4d28dd7b83fec375998a3ef7765daad5
      - ev_4e0e4c52428621ce39f8222ea2d2141142544c78bab7cd2ddf9e952bdd503050
      - ev_0f8e3b60a3f0cf859d9ed07176856e34da1ff73c97b3cb3f4d6c3fca70316732
      - ev_349bbf76d6774b6067a87109fdcbe6b97e81298320ddf99462863587b66b3c30
      - ev_f7547d28178afa0feed009942d7a6877ddd06b7a4b0d5db8a5af8297db13ec58
      - ev_b1cced386811d6b591b49d491173103b6340e4da16dc9de7d82994335e168849
    not_proven:
      - the meaning of the power-chip calls inside the board power-off
      - whether the RTOS PowerSave matters for anything once the power is cut
      - the plugin's sys_set_int text format (decimal is assumed)
    detail: src/app/VALIDATION.md

  - id: app.power-hold-poweroff-20261105
    status: accepted
    kind: runtime
    statement: >
      With executable 15a28f82..., a Power hold (key 116 press) at READY made
      the app close its capture session and storage, play powerOFF.wav, re-run
      itself from /tmp/g360-app-poweroff as --power-off and run sync,
      device_set_property(4, 0x15, 1), deviced_request_power_off(), sync and
      device_set_property(4, 4, 0). The camera switched itself off, on two
      boots (1793856869 and 1793857076), and booted normally afterwards. On
      the next boot the card mounted without a kernel error, both FAT copies
      carried the clean-shutdown bits, the app's directories had one live
      entry per name, both counter slots held 4, and shots 00002 to 00004
      matched their earlier host copies byte for byte.
    address_space: linux-app-elf
    also_involves: [physical]
    evidence:
      - src/app/VALIDATION.md
      - src/app/tests/test_power.py
      - src/app/tests/test_app.py
    not_proven:
      - a Power hold during a capture on the camera (host-tested only)
      - deviced's reply and whether its unmount needed the forced path
      - the time from the hold to power-off
    detail: src/app/VALIDATION.md

  - id: app.hdr-sweep-via-flash-queue-20261105
    status: accepted
    kind: runtime
    statement: >
      With executable 517ad99b..., `g360-app --sweep-once` on boot 1793857325
      (stock app inactive, no service started, no power cycle) took 8 stills
      at the hdr-capture.sh exposures (TV/ISO 48/1600, 48/400, 48/100,
      80/100, 112/100, 144/100, 176/100, 208/100) with the JPEG copies
      skipped, saving each DNG to the /opt/usr queue with fsync before the
      next. Each still's own Exif record matched the request (1/8 s at
      ISO 1600, 400 and 100, then 1/30 to 1/8000 s at ISO 100). From the
      first capture's start to the last capture's end took 16,702 ms;
      moving the 8 frames to the card took 19,426 ms. The card got eight
      33,733,196-byte DNGs on consecutive counter numbers and a sweep CSV
      with the exposures; the queue was empty afterwards. In frames 1, 4 and
      8 of a dark scene the maximum sample fell from 65472 (clipped) to
      17536 and 8128. The same build, launched through the double-Power
      trampoline and start.sh (eefff93c...), reached READY with the queue
      /opt/usr/g360-app/queue and sweeps available.
    address_space: linux-capture-elf
    also_involves: [physical]
    evidence:
      - src/app/VALIDATION.md
      - src/app/tests/test_queue.py
      - src/app/tests/test_app.py
      - src/app/tools/sweep-trial.py
    not_proven:
      - the hold-Capture gesture and the HDR SWEEP hint on the real buttons
        and screen (host-tested only)
      - a Power hold during a sweep, and the move of left frames at the
        next start, on the camera (host-tested only)
    detail: src/app/VALIDATION.md

