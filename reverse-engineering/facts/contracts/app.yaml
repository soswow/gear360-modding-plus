  - id: app.double-power-tries-home-wifi-20261106
    status: accepted
    kind: runtime
    statement: >
      A double-Power launch of g360-app tries the home network first. After
      the stock app is inactive, src/app/start.sh (16aef4e5...) runs
      src/wifi/wifi-join.sh app-start (9461bd52...)
      while holding the controls, screen and experiments locks, and only
      when the card has its "wifi" network file. On boot 1793924221, with
      g360-app stopped by SIGTERM and the camera's access point up, a
      double-Power ran it at 12:24:23 (camera clock). wl scan from the
      running access point found the network; disable_wifi_ap at 12:24:32;
      the station firmware loaded and wpa_supplicant joined WPA2-PSK/CCMP at
      12:24:38; DHCP gave <home-network-ip> at 12:24:39. A keeper started from a
      copy in /tmp, and g360-app reached READY about 20 s after the press.
      Then g360-app held all three locks; the keeper, wpa_supplicant and
      udhcpc held no lock and no card file, all with their working directory
      at /. /opt/var/lib/connman held only "settings". Later on the same
      boot: with the link dropped on purpose (wpa_cli disconnect, 12:27:15),
      the keeper reported "no link for 120s" at 12:29:22 and the access point
      was back at 12:29:26, with the app still running. With a made-up network
      name in the card's file, a double-Power at 13:01:03 kept the access
      point (same hostapd process) and the app started at 13:01:14. On fresh
      boots with the stock app active: a double-Power joined (boot
      1793934917); a Power hold while joined powered off normally; a press
      about 3 s after the stock screen ran app-start 38 s after boot. With a
      plain wl scan that run wrongly kept the access point (a plain scan found
      the network in 2 of 3 tries); wl scan -s <name> found it 5 of 5, and
      with it the same early press joined (boot 1793936180, 17 s to READY).
    address_space: physical
    evidence:
      - output/wifi-station-20261106/RESULT.md
      - src/app/tests/test_launcher.py
      - src/wifi/tests/test_wifi_join.py
    not_proven:
      - the join failure paths on the camera (wrong password, no DHCP; host-tested only)
      - a press in the seconds before the stock app's access point is up (the
        15 s wait for it is host-tested only)
  - id: app.status-corner-wifi-battery-20261106
    status: accepted
    kind: runtime
    statement: >
      g360-app c0a7349e... draws a status corner at the top right of every
      screen: the Wi-Fi state (home network, the camera's own access point,
      or none), the battery with a bolt while charging, and the charge in
      percent. Its UI loop reads the kernel's files every 2 s and redraws
      only on a change. On boot 1793936180, on the home network with the
      cable in, the camera read battery/status Full, capacity 100,
      ac/online 1, usb/online 0, wlan0 operstate up and a default route on
      wlan0 via <home-network-ip>. The app, relaunched through the double-Power
      entry script at 15:29:56 (camera clock), logged "APP STATUS Wi-Fi home
      network, battery 100%, charging" and reached READY. On that boot wl ap
      read 1 on the home network, so it can't tell the modes apart; the
      access point is recognised as wifi-join.sh does it (a hostapd process
      and 192.168.43.0 on wlan0).
      Later on that boot the user unplugged the cable and the bolt went
      (APP STATUS ... battery 100% without "charging"). Build f3144cfa...
      (same boot, relaunched the same way) shows, where READY was, what a
      Capture click takes and how many more fit in the card budget; with the
      stored HDR 6-shot settings and 10.07 GB free it showed "48 SWEEPS" /
      "HDR 6 FLASH".
    address_space: physical
    evidence:
      - output/status-corner-20261106/RESULT.md
      - src/app/tests/test_status.py
      - src/app/tests/test_app.py
      - src/lib/g360display/tests/test_display.c
    not_proven:
      - the bolt coming back after a replug the charger chip recognises
      - the no-network and access point icons on the camera (host-tested only)
      - the count going down after a shot on the camera
  - id: app.stock-app-follows-battery-and-ap-by-subscription-20261106
    status: accepted
    kind: static
    statement: >
      The stock di-camera-app (output/firmware-survey/di-camera-app) imports
      vconf_notify_key_changed, vconf_get_int and vconf_keynode_get_int, and
      the tethering callbacks tethering_set_enabled_cb,
      tethering_set_disabled_cb and tethering_set_connection_state_changed_cb.
      Its strings name memory/sysman/battery_capacity, battery_charging,
      battery_charge_full, battery_status_low, battery_health and
      VCONFKEY_SYSMAN_BATTERY_CHARGE_FULL. On the camera these
      memory/sysman values are deviced's (battery_capacity 100,
      battery_charging 0, battery_charge_full 1 while Full on a charger, boot
      1793936180). So the stock app is told of battery and access point
      changes rather than polling. From imports and strings only; the
      callbacks' code was not decompiled.
    address_space: linux-app-elf
    evidence:
      - output/status-corner-20261106/RESULT.md
    not_proven:
      - which callback redraws the stock screen's battery icon, and how often deviced updates the values
  - id: app.wifi-setting-off-ap-home-20261106
    status: accepted
    kind: runtime
    statement: >
      g360-app 8272f99a... has a WIFI setting (OFF, AP, HOME; HOME offered
      only with the card's network file) stored in byte 15 of its settings
      slots, and starts src/wifi/wifi-join.sh "apply
      off|ap|home" in the background at start and on each selection; the
      launcher (start.sh 528cbfa6...) no longer joins. On boot 1793949314
      (the user's Power-off, power-on and double-press), with wifi-join.sh
      09177a6f...: the start's apply home found the network by a named scan
      from the access point and joined (address 17:16:07, camera clock); OFF
      stopped the keeper, udhcpc and wpa_supplicant (17:16:44) and the corner
      showed no Wi-Fi; AP asked the agent at once and the access point was up
      at 17:17:09; the next HOME turned the access point off, loaded the
      station firmware and then failed NOT FOUND after 30 s in SCANNING, and
      brought the access point back (17:18:13); HOME selected again joined 1
      s after the firmware loaded (17:18:36). In the kernel log the failed
      attempt shows one completed scan (6 networks) and no connect or further
      scan for 30 s, where both successful joins connected within 10 ms of
      their first scan.
    address_space: physical
    evidence:
      - output/wifi-setting-20261106/RESULT.md
      - src/app/tests/test_app.py
      - src/app/tests/test_settings.py
      - src/wifi/tests/test_wifi_join.py
    not_proven:
      - why wpa_supplicant stalled after its first scan (its debug log was overwritten)
      - the second wpa_supplicant (wifi-join.sh 30ce0149...) rescuing a stalled join on the camera
      - a fresh boot with OFF stored

  - id: app.live-preview-on-the-remote-page-20261107
    status: accepted
    kind: runtime
    statement: >
      On boot 139ef0e1 (stock stopped, hotspot <hotspot-ip>) g360-app
      258ef764 served the camera's movie preview: after cmd=preview&on=1 the
      capture worker started g360_preview_start (1280x640) and the app sent
      640x320 JPEGs (libturbojpeg) as multipart MJPEG on port 8090, about
      7.7 per second and 14.7 KB each to curl, and through the page's CGI
      relay (cgi-bin/g360?cmd=stream) to remote.html in a browser. A remote
      Capture with a 5 s delay kept the preview through the countdown,
      stopped it before the still (paused for the capture: ok), saved JPEG
      and DNG 20261107-154615-00105 and started it again; the page's stream
      resumed on the same connection. cmd=preview&on=0 stopped the camera
      preview and closed the stream; with the page closed the app stopped it
      20 s later. No kernel fault; the app kept running.
    address_space: linux-app-elf
    evidence:
      - src/app/VALIDATION.md
    not_proven:
      - a sweep with the preview on, phone browsers, more than two viewers, hours-long runs
    detail: src/app/VALIDATION.md
