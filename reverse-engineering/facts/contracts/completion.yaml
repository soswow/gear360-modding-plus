  - id: completion.linux-stage-notifications-have-no-request-token
    status: accepted
    kind: static
    statement: >
      Linux onBackendComplete at ELF 0x92c40 and onCaptureMemorySafe
      at ELF 0x92d60 require zero payload bytes and publish fixed
      internal topics 0x0101000e and 0x01010011 with integer zero.
      The checked bodies therefore do not carry a request token or
      sample pointer. onCaptureReady at ELF 0x92a00 accepts one byte;
      onImageReady at ELF 0x927e8 accepts two and forwards the value
      with topic 0x0201000a. Those scalar widths do not establish
      association with command 0x01010001.
    address_space: linux-capture-elf
    not_proven:
      - the RTOS producers and ordering of these notifications for a normal still
      - the semantic identity of the two-byte onImageReady parameter
      - safe association by serialization in a sole capture session
      - any RAW lease or completion and visibility of sensor samples
    detail: output/decompile/rea/pass-ssif-optional-reader-20261020/parent-review.md

  - id: completion.normal-graph-publishes-encoded-set
    status: accepted
    kind: static
    statement: >
      Type-0 builder 0x802ab858 calls JPEG builder 0x802c5f4c.
      That builder constructs callback 0x8029b534 and registers it
      with RegisterDoneCallback on its last JPEG material. The
      constructor installs 0x80688518; slot +8 is 0x8029ba94.
      On its successful paths that method publishes 0x03010005.
      Bridge body 0x800609f8 can serialize this ENC_SET into the
      pref descriptor ring and send category 0x81, attribute 0x0201.
      Linux setCaptureImageReady, ELF 0x9b1cc, selects the ENC_SET
      callback, which reads that ring. This establishes the encoded-set
      result route. Its optional first descriptor has a configuration-selected
      type; the ENC_SET name alone does not exclude RAW. See
      raw.encoded-set-descriptor-writer and the open conditional-RAW candidate.
    address_space: rtos
    also_involves: linux-capture-elf
    not_proven:
      - live graph execution or request association
      - bridge listener registration and current interceptor state
      - the gate value when a future still completes
      - sample lifetime or caller-owned sensor RAW
    detail: output/decompile/rea/pass-enc-ring-20261020/parent-review.md

  - id: completion.enc-ring-position-is-not-request-generation
    status: accepted
    kind: static
    statement: >
      RTOS writer 0x80061158 uses pref byte 0x1c50 modulo 25,
      stride 0xf00, base offset 0x19354 and transfer size 0xd70.
      A nonzero ready value at 0x342ad + slot only logs; the
      writer still copies, writes its successor cursor, then
      ready 1. Linux GetStillImageEncData at ELF 0x79d34 uses
      independent byte 0x1c51 modulo 25. If the selected ready
      value is zero it copies the previous slot without checking
      that slot's readiness, advances from that selected index
      and clears its ready byte. Neither ring control compares
      a request cookie or generation. A result callback or cursor
      advance alone therefore does not establish this still's
      fresh result. Selector 0xff resolves to 0x85400000, so the
      two cursors and 25 ready bytes have fixed physical locations
      observed by enc-ring-state, not by a pixel reader.
    address_space: rtos
    also_involves: linux-capture-elf
    code: tools/probes/ram-reader/ram_helper.c
    not_proven:
      - that opaque EXIF or maker data contains no usable identifier
      - lower pref synchronization or cache visibility
      - a live overwrite or stale read
      - a pixel lease from a descriptor-ring slot
    detail: output/decompile/rea/pass-enc-ring-20261020/parent-review.md

