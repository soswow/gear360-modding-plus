  - id: completion.event3-has-hardware-source
    status: accepted
    kind: static
    statement: >
      On the type-0 path, PP hardware status bit 6 invokes driver callback
      index 6, then an event-3 fanout. The callback table entry +24 is at
      0x8144a780. The dispatcher reads bit 6 from 0x20800018 and acknowledges
      through 0x20800020. Secondary thunks adjust this by -0x120 and reach
      the S and PP handlers. The fanout calls (listener, 3, 0). It carries
      no image address, request token, or generation.
    address_space: rtos
    not_proven:
      - that event 3 means the still requested by command 0x01010001
      - a fresh frame
      - cache visibility to Linux
    detail: archive/INVESTIGATION_CHECKPOINT_20261019_DUAL_PRODUCER.md

