  - id: completion.adapter-defers-release-during-native-call
    status: accepted
    kind: static
    statement: >
      The experimental adapter admits and reserves its own setter/submission
      calls under the callback lock, arming a still in the same locked step.
      A callback copies and latches its first eligible result immediately,
      but queues first-image release while that native call is reserved.
      Call exit atomically clears the reservation and claims a queued release,
      then invokes release without the lock and guards later host writes by
      live pointer and identity. A failed deferred release is not retried:
      copied bytes remain collectable, while mutation and process reuse are
      refused. Busy host close skips native client destruction and leaves
      that obligation unrecovered. Stable setting-error messages and captured
      mode verbosity avoid the reviewed post-call freed-host accesses.
      Parent ASan/UBSan checks, ten fresh-process TSan cases and offline ARMv7
      linking pass. These are software/stub/build contracts only.
    code: src/lib/capture-session/capture_session_library.c
    not_proven:
      - a general concurrent caller API, eventual native return or late post-close delivery retirement
      - qualified callback ABI, valid native copy interval or native tolerance for deferred release
      - sensor provenance, same-request completion, whole-result retirement or camera recovery
      - working phase2 capture or permission to execute the target SDK path
    detail: output/decompile/rea/pass-lrc-export-20261026/parent-review.md

  - id: completion.adapter-latched-copy-and-retirement-state
    status: accepted
    kind: static
    statement: >
      The experimental library adapter latches its first validated private
      copy. An extra encoded set before or after collection is refused before
      payload access and quarantines local process reuse. Native-release
      progress and nonzero/uncertain outcome are tracked separately from
      private-copy ownership. Mutating requests are blocked during release
      or after uncertainty, while already copied data remains collectable
      unless the separate pre-existing abandoned-request state applies.
      Closing a host/session with release in progress also forbids reuse.
      A locked health snapshot reports actual remaining private buffers
      and local admission state; zero native return proves no remote retirement.
      Parent ASan/UBSan suite and six targeted TSan processes pass, as does
      offline ARMv7 linking against pinned libraries. No camera code executes.
    code: src/lib/capture-session/capture_session_library.c
    not_proven:
      - request identity, sensor provenance, safe native copying or callback ABI at runtime
      - whole-result retirement, remote quiescence or recovery by a new process
      - working phase2 capture or a qualified reusable native session
    detail: output/decompile/rea/pass-host-services-20261026/parent-review.md

