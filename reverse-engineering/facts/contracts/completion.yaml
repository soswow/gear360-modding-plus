      preserves timeout/clock-failure requests for late collection, refuses
      configuration while in flight and latches malformed completions until
      close. It handles per-output release failures, exact aliases and callback
      borrowing against a backend seam. Parent359 sanitizer-backed C checks,
      C++ linkage and ARMv7 object compilation pass. Partial initialization
      and rejected/failed-release cleanup remain the backend close contract.
