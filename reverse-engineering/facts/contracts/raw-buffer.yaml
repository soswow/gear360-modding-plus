  - id: raw.wdma-destination-has-no-linux-receiver
    status: accepted
    kind: static
    statement: >
      From still_request_dispatch, the only Linux-callable edge is the
      48-byte CaptureStillImage submit of command 0x01010001. The RTOS
      edges after it carry a 12-byte record, recipe 1, the type-0 graph,
      or an image pointer: controller 0x8010d938, CCmdCaptureNormal
      0x800ef078, CDriveSingle 0x80326240, builder 0x802ab858, and the
      route-3 pointer at service word +0x18. They do not carry sensor
      samples. The first sample edge is RTOS-internal. When service byte
      +0x38 is zero and byte +0x14 is nonzero, 0x80321df4 takes service
      word +0x18. If that pointer is nonzero, 0x8031a250 stores it at
      0x81952e50. Readout 0x8031a704 then stores that word at 0x81952fa4
      and start_wdma 0x8031c098 reads it back as the image. When the image
      pointer is nonzero, 0x80541b48 returns the word at image +0x84, the
      enabled third DMA tuple carries it, and 0x80511dec stores it to
      WDMA0 at 0x20800338. No Linux-callable receiver retains that backing.
      That missing receiver is the library function for this still's samples.
    address_space: rtos
    not_proven:
      - that a live still took the route-3 branch
      - that calls between the store at 0x8031a730 and start_wdma preserve
        the word at 0x81952fa4
      - that the word at image +0x84 held a finished sensor frame
