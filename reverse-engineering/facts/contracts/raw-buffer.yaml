  - id: raw.gyro-handoff-pauses-still-with-full-frame-intact-20261104
    status: accepted
    kind: static
    also_kind: observation
    statement: >
      RecipeNormal attaches to the SSIF stage (the full frame at 0xa6000000)
      an action (FUN_80574c2c, table 0x80650f90) whose Execute FUN_80139df8
      publishes 0x3010008 (STL_EXPANSION) and waits on flag 0x81483518 with
      timeout 0xffffffff before logging GET A9 SENSOR DATA SUCCESS/DONE; a
      stage's PostProcess (FUN_80250880) runs such actions (FUN_80324fe0)
      before setting its done state. In R1, Q1 and Q2 the lens 1 pass began
      1.7-1.8 ms after that log line, 5 ms after the publication. The reply
      comes from libcapture's Beauty client (RegCallbackClient "fd_alg",
      captureProcessA9, subscribed to 0x4010008 in the CBeautyFaceIf_Linux
      constructor). CCapturePublisher::Subscribe appends {topic, callback}
      with push_back and Publish calls matching callbacks in order,
      synchronously, on one thread; CCapImageSetCb::OnCallback calls its
      client as (0x4010008, 0, descriptor, 0x3c8) after
      GetStillImageExpansionData, which a second reader re-reads from the
      same slot (fallback to the previous slot when the ready byte is
      clear). So a client subscribed to 0x4010008 before the Beauty object
      runs before the gyro reply and can hold the still while the full
      frame is intact.
    address_space: rtos
    also_involves: [linux-capture-elf]
    evidence:
      - ev_87d448550ffdb8a316aebc8b4a87f07efdc2f9567540fea87c08219fe1a5d741
      - ev_135ba240a7501a56bd00a2ef005678f0694d6874ab10f7db16a8c24c2690b3a0
      - ev_9fe040b1750ce88270a1002760c609a09fb8649847698472f39581f8aad24ceb
      - ev_d7f5b11a04d6e9e7b51a93afed7de2a1c6c4d60848b63de0218e5ca145c16ece
      - ev_9c4e533deb30caa7dd340a7da377a717a6383e7cfb018a2f5d7547a01325dc3c
      - ev_f38f62b47b5827dc01fc182d025ef7a39617c5cf6fac3b271b583cb87c1f0bb7
      - ev_4d8b2c834aab4d016d8c523aec658adc48f6670bfa24cfcb308c0b1b052750f7
      - ev_4f4b6275bdd67dedb4d39557d7272ff2fb568377afbaafb90b9d3b7b86f5e37d
      - ev_50c45f38681d8aa7e6cb34079539a86c2bc5a501f4f6288edb59b2e48a5fd4c9
      - ev_28b69a3f4d0d3c7db79e29b5419e40ac4d174e55d02a03bc9e9d69a4d03a0815
    not_proven:
      - that subscribing before the Beauty object puts our client first at runtime
      - that no other RTOS timer fails a still held for about 1 s
      - the full frame's sample format beyond its last dark rows
    detail: output/decompile/rea/pass-expansion-pause-20261104/RESULT.md


