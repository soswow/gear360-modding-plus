    kind: static
    statement: >
      encoded-set decodes exactly one0x228-byte metadata constituent
      into caller-owned values: set type and four address-type bytes,
      first physical/virtual words and buffer-size words. It reads
      little-endian fields without input alignment assumptions, preserves
      unknown values, refuses other lengths/null arguments and leaves
