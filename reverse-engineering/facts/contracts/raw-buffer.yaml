  - id: raw.image-set-extraction-layout-and-srw-naming
    status: accepted
    kind: static
    statement: >
      In the pinned capture library, CCapImageSetCb::OnCallback's 0x3010005
      arm reads the encoded still set into a 552-byte stack block, converts
      each image's physical address to the virtual one and writes it back,
      and invokes the app-facing callback as (public_topic, &set_pointer, 0,
      0). The block's layout is: set type u32 at+0 (1 plain, 2/3 raw), first
      image descriptor at+8 with physical word+0x4c, virtual word+0x5c
      (filled by the library before the callback) and size word+0x7c; main
      image at+0x90 (phys+0xd4, virt+0xe4, size+0x104); screen at+0x118
      (phys+0x15c, virt+0x16c, size+0x18c); thumb at+0x1a0. The first
      image's conversion error text is "srw address convert error.",
      naming the first image SRW (Samsung RAW). The client reads the virtual
      address and size, copies synchronously and releases via
      ReleaseCaptureBuffer.
    address_space: linux-capture-elf
    addresses:
      image_set_callback: "0x7f004"
    evidence:
      - ev_4f4b6275bdd67dedb4d39557d7272ff2fb568377afbaafb90b9d3b7b86f5e37d
    not_proven:
      - that the callback fires from our client, or that the SRW bytes are
        the Samsung3 stream
      - the SRW container header versus the raw compressed bytes
    detail: output/decompile/rea/pass-liveview-contract-20261030/next-edge/still-path/IMAGE-SET-EXTRACTION.md

