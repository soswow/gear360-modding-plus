  - id: raw.resize-main-image-reuses-lens1-ipc-releases-sources-20261104
    status: accepted
    kind: static
    also_kind: inference
    statement: >
      RecipeNormal (FUN_802ab858) chains SSIF, lens 1 and lens 2 PP outputs,
      maker note, per-lens Ipc/Ldc/3dLut, Stitch Main, Resize (FUN_802bdc04)
      and Jpeg (FUN_802c5f4c, fed by the Resize stage). The Resize stage
      creates a new main image of type 0x22 (type 0x2e needs two
      contradictory checks of order-sheet byte +0x229), sized by
      FUN_801438ac: 5792x2896 unless image size is 0x20010 (DUAL_SMALL,
      5376x2688) or order-sheet bytes +0x254/+0x170/+0x229 select 7200x3600,
      2896x2896 or 16:9 sizes. The block finder FUN_800afb80 allocates
      bottom-up first-fit for all but the JPEG types 0x39/0x3a. The Ipc
      builder FUN_802bb688 attaches a release of its source image
      (FUN_8057498c) unless its last argument is set or recipe-context word
      +0xb4 is 0x16, 0x17, 0xb or 0x1f; RecipeNormal passes 0 for both
      lenses, so both lens images are freed after development. The values
      that skip the release match CCmdCaptureNormal's modes for HDR (0x16)
      and a smart mode (0x17); a normal still is mode 1. libcapture maps
      every value of its API attribute 2 (image size) to -1, and no other API
      attribute produces wire attribute 2. Hence the 33,547,264-byte picture
      found in lens 1's memory in Q1 is the Resize main image (the JPEG
      input), placed in the lowest free gap, which begins at lens 1.
    address_space: rtos
    also_involves: [linux-capture-elf]
    evidence:
      - ev_2c294c0fb5e83bddadcdc4a1fea9ff2ac87b5d095b2320dffb23ded9b178dc13
