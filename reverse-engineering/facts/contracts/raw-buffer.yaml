  - id: raw.stock-jpeg-iq-records-20261105
    status: open
    kind: observation
    statement: >
      Every stock JPEG's Samsung Type 2 MakerNote carries the camera's IQ
      state; all 721 saved stock JPEGs (714 from this camera, 7 from the
      second camera) decode with reverse-engineering/dng/stock_iq.py. AWB
      record 0x00a0 (13,000 bytes, XOR 0xC8, "AWB" v0x105; 0x00a1 identical
      in all 721): a 3x3 matrix at 0x2e14 (int32, x128, rows sum to 1; equal
      to its copy at 0x2e38 and to the AE record's int16 copy at 0xd1c in all
      721), the most common being 1.805 -0.742 -0.063 / -0.211 1.453 -0.242 /
      0.016 -0.594 1.578 (430 shots across R/B gain ratios 0.28-1.87; 52
      variants); per-shot R,G,B gains at 0x2eb0 and 0x2f2c (65536 = 1.0);
      per-camera constants at 0x2dac/0x2db8 (two lens adjustments) and four
      white points per lens (0x2e60..0x2fb4). White point P1 times the lens
      adjustment equals 0.7043/0.3367 (R/G, B/G) for both lenses of both
      cameras; the other three points agree within about 2%. Colour record
      0x00c0 ("I!?C", CIpcParamD5): a 19-knot tone curve (0x174 inputs
      0-16383, 0x1c0 outputs 0-1023; 86 variants), a 3x3 YCC-domain matrix at
      0x218 (x128, changes with the 0x2e14 matrix) and BT.601 RGB->YCbCr at
      0x23c. Writers read in the saved 19 October Ghidra decompile:
      FUN_803aa714 (AWB, from IQ_MN_GetMNData_1), FUN_803d647c (I!?C
      header), CAE::GetMakerNote1 FUN_803b0a7c (AE).
    address_space: rtos
    evidence:
      - reverse-engineering/dng/README.md
      - reverse-engineering/dng/stock_iq.py
      - output/decompile/rea/pass-opus-engine-20261019/rtos/rtos-full.decomp.c
    not_proven:
      - each white point's illuminant
      - the colour record's 0xae triples' stage and channel order
      - the field writers in a fresh REA session (only the saved decompile was read)
    detail: reverse-engineering/dng/README.md

  - id: raw.dng-pair-p2-confirms-iq-pipeline-20261105
    status: accepted
    kind: runtime
    statement: >
      Pair P2 (boot 1793781685, stock stopped, reenter, g360-shot bd6a564e...
      --frame --count 1, auto WB, Smart Range on, no reboot) saved the full
      RAW frame, our JPEG (no Exif) and the camera's maker-note buffer, now
      copied by g360cap before its give-back. The buffer starts with the IQ
      block at the RTOS offset table's places (AWB 0x14, AE 0x32dc, colour
      0x4a4c). The JPEG is the two fisheye halves; each 2896-wide half is the
      2912-wide RAW half cropped 8 px per side. RAW black is 64.1-64.5
      (10-bit) in all corners, lenses and CFA sites; CFA GRBG on both lenses;
      the JPEG/RAW ratio is flat across the radius (lens shading already
      corrected in the frame). On 18 colour-checker patches, black ->
      recorded AWB gains -> recorded 0x2e14 matrix -> recorded tone curve on
      (RAW - black) x ~20.3 predicts the JPEG to 6.0-6.2 RMS (8-bit), against
      23.0 without the matrix; a free 3x3 fit gives 5.9 and resembles the
      recorded matrix. Per-lens gain fits differ by +1.6% R / -0.5% B left
      vs right, matching lens adjustment a/b (+1.7% / -0.5%): a is the left
      half.
    address_space: physical
    also_involves: [rtos, linux-capture-elf]
    evidence:
      - output/dng-P2/RESULT.md
      - reverse-engineering/dng/stock_iq.py
      - src/lib/g360cap/g360cap.c
    not_proven:
      - other scenes, light sources, white-balance modes or the second camera
      - the YCC saturation stage and Smart Range local tone mapping (not modelled)
      - where the ~1.27 gain before the curve is recorded
    detail: output/dng-P2/RESULT.md

  - id: raw.native-capture-exif-record-20261105
    status: accepted
    kind: static
    statement: >
      Pinned libmm-photo's ImageGenerator::captureDataReceiver copies an
      inline 0x2d8-byte stCAPTURE_EXIFDATA record from image-set +0x8 into
      DataFromCapture +0x10. The queued consumer passes that record to
      CaptureDataParser::convertExif. ExposureTime is the little-endian
      uint32 numerator/denominator at +0/+4; ISO is uint32 +0x70, narrowed
      to Exif SHORT. ExposureProgram is uint32 +0x6c and WhiteBalance
      uint32 +0x84. Stock diagnostics explicitly label these fields. They
      are independent of the basic image descriptor and IQ MakerNote buffer.
    address_space: linux-mm-photo-elf
    evidence:
      - ev_76366aeb9840ef51839e6e876e4559d702e92617a615c5fa59aa1eb6eb878a94
      - ev_89e1970b1a1ff7ff1c69da15630c7005c6af91e75b3de82bfcdbcc54d13614ee
      - ev_dd0554dd2cb3cc61b4031102b9763485089a0aa15aadd0f56461d528b6893dcc
      - reverse-engineering/dng/T1_T2_VALIDATION.md
    not_proven:
      - every remaining stCAPTURE_EXIFDATA field and its producer
      - metadata/processing stages in other capture recipes
      - a per-shot date source or the full MakerNote tail
    detail: reverse-engineering/dng/T1_T2_VALIDATION.md

