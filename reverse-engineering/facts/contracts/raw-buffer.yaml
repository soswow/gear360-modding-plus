      dump, not a caller-owned result (raw.optional-ssif-reader-is-debug-dump).
      A matching Linux file writer exists; that does not establish
      an ordinary RAW receiver. Recover a Linux-callable handoff
      that associates the completed samples with our submitted still
      and preserves them through caller release. A recipe of our own
      would need a supported callable construction/export interface;
      RTOS callback addresses alone are not that interface.
    blocks: the library acceptance test
    detail: output/decompile/rea/pass-ssif-optional-reader-20261020/parent-review.md

  - id: raw.path-code-selects-raw-bit-depth
    status: accepted
    kind: static
    statement: >
      CFrontEndServiceBase judgePath at0x803212c4 derives a path code from
      the PP control-mode route bytes: when byte+0x38 is set and byte+8 is
      zero, the code is3 when byte+0x2c is zero and5 when it is nonzero;
      byte+0x14 set yields4, byte+8 set yields1 (6 when0x8057bc8c is
      nonzero), and no route yields minus1 (preflash mode). Mapping leaf
      0x80321424 converts path5 to setup byte1 and path3 to setup byte2,
      all others to0. Combined with the accepted
      raw.id23-page-initializer-derives-image-field60, setup byte1 selects
      b=10 and setup byte2 selects b=12. The measured 18 October raster's
      multiples-of-64 samples and 65472 white level match b=10 stored in
      bits6..15 of the 16-bit word. The stride derivation's units remain
      unproven: for W=5824, b=10 it yields 7296, not the measured raster's
      11648-byte row stride, so field0x60 must not be treated as the file
      byte stride.
    address_space: rtos
    addresses:
      judge_path: "0x803212c4"
      mapping_leaf: "0x80321424"
      route_byte_getter: "0x803228f8"
      cap_set_info: "0x803214e4"
    evidence:
