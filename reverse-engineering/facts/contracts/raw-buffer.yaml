  - id: raw.encoded-callback-mapping-limits
    status: accepted
    kind: static
    statement: >
      In Linux CCapImageSetCb's encoded branch, a prior metadata conversion
      and the conditional first-image conversion reuse the same output
      scratch. After the first-image conversion, the handler stores that
      scratch at descriptor+0x5c even when the converter returned negative.
      Converter0x76154 checks its instance's byte+0x20: when zero it
      returns zero without writing output; when enabled it rejects only
      a zero physical base/input, otherwise computes virtual_base plus
      input minus physical_base. The size argument is diagnostic and no
      interval bound is enforced here. Thus the descriptor's virtual
      word is not proof of a valid mapped extent or retained pixels.
      Callback argument two points into this invocation's stack storage;
      its first word references the stack descriptor copy. Copying this
      metadata alone does not pin backing. The actual producer/release
      protocol remains a separate open edge.
