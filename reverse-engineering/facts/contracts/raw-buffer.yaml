  - id: raw.frame-f2-two-full-frame-stills-pass-20261104
    status: accepted
    kind: observation
    statement: >
      Trial F2 (boot 1793780407, user present, g360-shot af2b7f15...,
      g360-shot --g360 2 --frame, no setting changed) took two normal stills
      in one process. Both completed with capture-ready (1481 and 1362 ms),
      complete JPEGs and four give-backs each (types 5, 7, 8, 9); live view
      restarted after each; no reboot. In each, the library's expansion
      callback copied the 33,732,608-byte frame at 0xa6000000 (flags 0x103,
      unchanged during the copy) while the RTOS waited between EXPANSION and
      GET A9 SENSOR DATA SUCCESS/DONE: 688.7 ms and 619.5 ms (library hold
      660,000 and 596,000 us). libcapture logged Publish [3010008] exec time
      681 ms before the Beauty object's captureProcessA9 ran. The two frames
      differ; their 2x2 means put the higher pair on the diagonal (6902/6916,
      6892/6905) and their halves correlate 0.707/0.682 and 0.709/0.687 with
      the same JPEG halves (cross-halves -0.06 to -0.10).
    address_space: physical
    also_involves: [rtos, linux-capture-elf]
    not_proven:
      - the hold in other recipes, drive modes or long exposures
