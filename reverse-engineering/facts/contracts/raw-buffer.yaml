  - id: raw.first-image-is-lrc-stage-output
    status: accepted
    kind: static
    statement: >
      The carrier names the still's raw pipeline stages STILL_PREPROC_LRC,
      STILL_PP_LRC and CMaterial_PP_LRC_Still, and logs "normal single
      capture with LRC compress", "lrc & wdma done Compressed raw size=%d"
      and "Compress Size : %d". The LRC material's Finish path (0x8029512c)
      stores and logs the compressed size (param_2) and notifies 0x3006 with
      it; 0x8029528c stores the size into both the image and the material
      at+0x124. Combined with CCallbackJpegImageSet naming the first image
      Raw Compress, the still's first image is the LRC (Low Raw Compression,
      WDMA-assisted) stage's output, distinct from the SSIF 10-bit-in-16-bit
      sensor stream. Whether the delivered buffer holds compressed bytes or
      an uncompressed form, and the LRC algorithm, are not established.
    address_space: rtos
    addresses:
      lrc_finish: "0x8029512c"
      lrc_size_store: "0x8029528c"
