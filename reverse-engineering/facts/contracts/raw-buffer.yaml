  - id: raw.normal-still-raw-frame-overwritten-by-stitched-picture-20261104
    status: accepted
    kind: observation
    statement: >
      In trial R1 (one normal still, SUPERFINE, boot 1793761816) g360cap read
      physical 0xa6000000 for 0x202b800 bytes after the image set arrived and
      before giving buffers back. The first 0x1ffe400 bytes are an 8-bit YUV
      4:2:2 picture of that still, 5792x2896, luma plane then interleaved
      U/V (luma correlation 0.9998 with the main JPEG scaled to 724x362,
      mean absolute difference 0.75 levels). The remaining 0x2d400 bytes are
      the end of the RAW frame at stride 11648: 16-bit words, every value a
      multiple of 64, range 3712-7616, matching diagonal 2x2 position means
      (4205.7/4210.0 and 4158.0/4158.6). The RTOS log orders the steps: raw
      work 1 writes 0xa6000000 (542.161-542.203), raw work 2/3 write lens
      images at 0xab134000 and 0xad134000 (to 542.259), the stitch step logs
      "End of 1st/2nd image copy" (542.341, 542.363), live view takes
      movieWork at 0xAB134000 (542.409), then the image set is sent
      (542.441). So the still's own stitch step overwrites the RAW frame
      with the finished picture before Linux learns of the still. The same
      sequence, with SetPreventRawClear [false], appears in trial 5a at
      RAW_SUPERFINE quality.
    address_space: physical
    not_proven:
      - the stitch step's destination from the RTOS itself (inferred from the bytes)
      - whether any setting, recipe or SetPreventRawClear true keeps the RAW frame
      - the format of the two lens images (RAW-domain or YUV)
      - the sample format beyond the 15 surviving dark rows
    detail: output/decompile/rea/pass-rawR1/RESULT.md

  - id: raw.stitch-uses-pool-buffer-lens-images-are-corrected-raw-20261104
    status: accepted
    kind: static
    also_kind: observation
    statement: >
      The stitch step is the stage CMaterial_NX1_Still_Etc; its work
      function FUN_802903cc (recipe IDs 0xf08xx) copies input 0's image and
      then input 1's image side by side into the stage's own output image
      (slot stage+0xc4, address in a memory handle at image+0x80), logging
      "End of 1st/2nd image copy". Its destination is therefore whatever the
      capture memory manager gave that image: a single pool initialised at
      0xa6000000 (FUN_800abe18), allocated first-fit in 16 KB blocks by type
      (allocEx FUN_800af108, alloc FUN_800ac834: RAW and SRW 0x3c00000) and
      freed back by freeBlock (FUN_800b04b4). SetPreventRawClear
      (FUN_801055a4) only guards a counter reset. In trial R1's RTOS log the
      two lens-image passes ("PP Path Still 1") applied lens shading
      ("lsc on"), crosstalk ("xtc set for still") and defect correction
      (set_info_DPC) on the PP core, whose DMA setup (FUN_8031b9b4) converts
      every image to a RAW bit width (FUN_8031c658), and wrote 2896x2896
      images at stride 5824 to 0xab134000 and 0xad134000. Live view
      allocated movieWork at 0xAB134000 at 542.409, the image set followed
      at 542.441, and the first live-view write came at 542.552 to
      0xac8ef000, between the two lens images.
