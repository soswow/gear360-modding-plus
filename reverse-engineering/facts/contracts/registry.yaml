  - id: registry.shell-command-map-is-single-caller
    status: accepted
    kind: static
    statement: >
      Accepted, static, narrowed to the executor's own instructions. The parent
      re-read the MCB SHELL_COMMAND executor 0x8004a848 through REA/Ghidra. For
      argc>1 it builds a key from argv[1] with 0x805c4388, calls 0x80540820 with
      this+4, checks the result and the end condition, and on the admitted branch
      calls the found object's vtable slot +8 with argc-1 and argv+1. That is the
      checked behaviour of that function. It does not establish the key strings
      that are actually inserted into the command map, constructor activation,
      complete registry membership, or that every path to that map uses this
      particular lookup. No caller is assigned here to the map search 0x80540b14,
      which would need separate evidence. The claim id is retained from the worker
      pass for historical reference and does not assert a single-caller property.
    address_space: rtos
    addresses:
      executor: "0x8004a848"
      key_builder: "0x805c4388"
      map_lookup: "0x80540820"
      map_search: "0x80540b14"
    not_proven:
