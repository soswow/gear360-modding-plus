  - id: registry.ref-reg-formatted-context
    status: accepted
    kind: static
    statement: >
      The ref node execute0x800e8718 forwards argc/argv to0x800126e8.
      Its selected reg branch passes r4 and three stack-buffer pointers
      to0x80517a98 (SWI6, key0x80120400). On a nonnegative return it
      calls0x80516ae4 with console sink0x80011e70 and those buffers.
      Six format lines label PC/CPSR/TMF, R0..R11, IP/LR and
      USP/SSP/LSID/UATB. In the third buffer C, the last format consumes
      USP=C+4, SSP=C+0, LSID=C+0xc and UATB=C+8 as raw32-bit words;
      LSID is displayed in signed decimal, the other three in hex.
      A later, separate0x80517768 call supplies the additional stack-area
      displays. The first service is not a TID parser and the output is
      not stack geometry alone. These are labels and caller dataflow;
      the subsequent conditional service/copy source is recorded separately.
      Runtime activation and active-register meaning remain unproved.
    address_space: rtos
    addresses:
      node_execute: "0x800e8718"
      shared_dispatcher: "0x800126e8"
      getter_wrapper: "0x80517a98"
      formatter: "0x80516ae4"
      format_block: "0x8079dbc8"
      selected_call: "0x80012834"
    not_proven:
      - runtime service selection, full saved-task layout or hardware readback
      - UATB equivalence to a live TTBR, active SCTLR or mapping attributes
      - successful runtime membership, invocation safety or fresh diagnostic output
    detail: output/decompile/rea/pass-sc-parent-review-20261021/parent-review.md
