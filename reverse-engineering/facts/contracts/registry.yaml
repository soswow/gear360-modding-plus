claims:
  - id: registry.ref-reg-uatb-is-conditional-ttbr-input
    status: accepted
    kind: static
    statement: >
      Getter service0x80023260 and setter0x80022fdc select records
      through the same pointer cell0x81c101d8, with positive stride
      (selector-1)*0xf0. Setter0x80022fdc stores input[0] into+0xd4
      and input[1] into+0xd8. Only on its selected-record-equals-current
      branch does it read CP15 c2/c0/1 and write c2/c0/0. Under the
      applicable VMSA interpretation these are TTBR1 and TTBR0. A
      nonzero input[0] is ORed with sampled TTBR1 low7 bits; zero
      input[0] instead leaves sampled TTBR1 as the written value.
      The UATB-labelled stored word is thus used as an input to this
      conditional path, not a fresh register readback. Helper0x80022acc
      also copies supplied C+8 into record+0xd4 under its C-nonnull gate.
    address_space: rtos
    addresses:
      getter_service: "0x80023260"
      record_pointer_cell: "0x81c101d8"
      current_record_cell: "0x81c10198"
      setter: "0x80022fdc"
      record_write: "0x80023090"
      cp15_read: "0x800230a0"
      cp15_write: "0x800230bc"
      context_copy_setter: "0x80022acc"
    not_proven:
      - actual execution, valid configured addresses or runtime table persistence
      - active TTBR0, SCTLR, remap registers or installed shared-ring mappings
      - complete writer coverage, sensor provenance or RAW ownership
    detail: output/decompile/rea/pass-audit-20261022-review/svc-context-review.md

