  - id: registry.control-register-has-one-reader
    status: rejected
    kind: inference
    statement: >
      Rejected as a proof, retained as an id. The record's masked sweep used the
      literal pattern 10 1f 11 ee with mask f0 ff ff ff. That mask admits 16
      distinct words, 0x101f11ee through 0x1f1f11ee, because the low four bits of
      the first byte vary while the second byte is fixed at 0x1f; the sweep
      therefore does not accept arbitrary destination-register encodings, and it
      does not cover the whole mrc p15,0,rX,c1,c0,0 family. The mask is a byte
      pattern: no ARM field is assigned from it, and no absence of readers is
      concluded from it. The corrected count of eight candidate sites is itself
      finite, and a finite candidate count cannot establish that no other reader
      exists, nor that any listed site is or is not command-reachable. The
      eight-site list is retained as a worker lead for further native work, not as
      an accepted exhaustive result. The id is retained so the original report's
      reference still resolves.
    address_space: rtos
    addresses:
      branch: "0x80013910"
      opcode: "0xEE111F10"
      other_readers: "0x80000168, 0x80000218, 0x80000e48, 0x80000ed0, 0x80001320, 0x80005828, 0x80011608"
    correction: >
      Restated by the integrating session on 21 October 2026, and rejected as a
      proof by the parent review of 21 October 2026. The original record and the
      original report both asserted that exactly one instruction in the image
      reads the control register. That assertion is not supported. The sweep
      pattern 10 1f 11 ee with mask f0 ff ff ff admits 16 distinct words,
      0x101f11ee through 0x1f1f11ee, with the low four bits of the first byte
      varying and the second byte fixed at 0x1f; it does not accept arbitrary
      destination-register encodings, and it also does not cover the whole family.
      The mask is a byte pattern, so no ARM field is assigned from it and no
      absence of readers is concluded from it. The corrected eight-site count is a
      finite candidate set and still cannot prove the absence of other readers,
      nor of command-reachable readers; the parent rejected that inference rather
      than accepting the corrected count as exhaustive. The id is retained so the
      original report's reference still resolves.
    not_proven:
      - the live SCTLR value, active mapping attributes or copy visibility
      - a CP15 read expressed through a different encoding or an indirect call
      - the enclosing functions of the four readers in unanalysed islands
      - the absence of further control-register readers
      - command reachability of any of the eight candidate sites
    detail: output/decompile/rea/pass-sc-parent-review-20261021/parent-review.md

