  - id: session.kernel-reboots-on-forced-fault-signal-or-abort-exit-20261104
    status: accepted
    kind: static
    statement: >
      In the camera's Linux kernel, the routine that prints "%s fault occurs,
      reboot now!!!" and spins (FUN_c0021d64, via FUN_c0021de8) is called
      from three places: the forced-signal routine FUN_c0038784 (force_sig_info
      path, used by __do_user_fault FUN_c0014c94) for signals 6, 7, 8, 9 and
      11, before the signal is queued; do_group_exit FUN_c002ad08 for exit
      codes 6 and 8 (death by SIGABRT or SIGFPE without core dump); and die
      FUN_c0011f94 (kernel oops). So a user-space fault reboots the camera
      whatever signal handlers the process has, and abort() (including
      assert failures and glibc heap-corruption aborts) does too; an
      external kill, SIGTERM or a normal exit does not.
    address_space: linux-kernel
    evidence:
      - ev_5fc73b436db80fc89438d48f63c15d87c771d86cda0495565be5b05d3b398814
      - ev_4a990f63f7551faa438a2873320922cec8e3287c7d27bcbf0d219398f66050e4
      - ev_d5196daf66217b29cf4ff98fadc78b74b8015e81c6581a0a80d375955c1f4ddd
      - ev_0e1785949b2e6cf84a0abdc887ae46e13ef01a82ac60086d4cf7714e01348708
    not_proven:
      - the reboot mechanism after the spin (watchdog or the other core)
      - every other caller of force_sig_info on this kernel
    detail: output/decompile/rea/pass-kernel-fault-reboot-20261104/RESULT.md

