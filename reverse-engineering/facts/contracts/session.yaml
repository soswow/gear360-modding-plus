  - id: session.stock-photo-library-releases-buffers-after-save-20261104
    status: accepted
    kind: static
    statement: >
      The stock app imports no ReleaseCaptureBuffer; libmm-photo.so does.
      Its image-set callback ImageGenerator::captureDataReceiver takes
      (topic, stCAPTURE_IMG_SET *set, ...), where word 0 of set points to
      the 0x228-byte basic set (word 0 = set type) and set+0x2e0 holds the
      maker-note address; for topic 0x4010005 it copies only the four image
      descriptors, set+0x8 (0x2d8 bytes) and set+0x2e0 (0x52c bytes) into a
      queue and returns, without touching image bytes. A worker thread
      (runFromCapture) builds the release list (makeCaptureReleaseInfo:
      maker note set+0x2e0; RAW basic+0x5c only for encode type 1; main
      basic+0xe4; screen basic+0x16c; thumbnail basic+0x1f4, all virtual
      addresses), saves the file, and releaseCaptureResource (called from
      SIFListener) calls ReleaseCaptureBuffer with types MAKERNOTE 5, RAW 1,
      MAIN 7, SCREEN 8, THUMB 9 in that order. This matches the recorded
      stock returns 5, 7, 8, 9. The capture library's own only caller of
      ReleaseCaptureBuffer (CNotifyHandler::onWriteDone) passes address 0.
    address_space: linux-mm-photo-elf
    also_involves: [linux-capture-elf]
    ghidra_addresses:
      capture_data_receiver: "0x9a388"
      run_from_capture: "0xb0698"
      make_capture_release_info: "0xaf39c"
      release_capture_resource: "0xb30b8"
    evidence:
