  - id: session.rtos-still-check-is-64mb-page-alloc-20261102
    status: accepted
    kind: static
    statement: >
      In the pinned carrier image the still's CDriveBaseNx::checkBufferFull
      (0x802756b0) calls the manager's vptr+0x38, which is 0x800ad300. That
      method delegates through the vtable's +0x34 (0x800ad298) to
      FUN_800afb80(manager, 1024, 0x30, 3, 0, 0xbfffffff, 0): the count
      1024 is FUN_8054aef4(0x4000000) = (0x4000000+0x3fff)>>14, a 64 MB
      probe of 1024 sixteen-KB pages. The type-'0' branch runs
      FUN_800afef8(manager, 1024, '0', 3, page_start, page_limit), a
      first-fit scan of the page table (the sixteen-byte entries at
      (page+0xb)*0x10, the state byte 0 = free) for 1024 consecutive free
      pages in the range manager[0x1a031]..manager[0x1a172] (the words at
      +0x680c4 and +0x685c8), and - because the bank byte 3 is nonzero -
      commits the allocation by marking the pages with the type '0'. On
      exhaustion it returns 0xbfffffff; 0x800ad298 reports available only
      when the allocator returns anything else, and checkBufferFull logs
      "Cannot alloc SSIF buffer!" otherwise. The still's death is therefore
      the manager failing to find 1024 consecutive free pages in its bank-3
      range, not an empty pool.
    address_space: rtos
    addresses:
      check_buffer_full: "0x802756b0"
      plus38: "0x800ad300"
      plus34: "0x800ad298"
      allocator_dispatcher: "0x800afb80"
      page_allocator: "0x800afef8"
    not_proven:
