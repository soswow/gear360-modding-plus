  - id: session.rtos-sensor-i2c-shares-linux-buses-3-4-unlocked-20261103
    status: accepted
    kind: static
    statement: >
      RTOS FUN_8030e52c names SENSOR_I2C_CH_FRONT = channel 3 and
      SENSOR_I2C_CH_REAR = channel 4 (100 kHz). The RTOS I2C init
      FUN_80034cdc gives channels 0-5 interrupts 0x45-0x4a (69-74), and the
      I2C read FUN_80035f38 addresses channel 0 at 0x10032000 and channel N
      at 0x10034000 + N*0x100. These are the interrupt numbers and register
      blocks Linux uses for drime5-i2c.0-5 (/proc/interrupts, /proc/iomem),
      so the front sensor shares controller 3 with Linux's rt5659 codec and
      EEPROM, and the rear sensor shares controller 4 with Linux's
      s2mu004 fuel gauge, USB-PD and EEPROM (about 130 interrupts per
      second at idle). No hardware lock covers buses 3 and 4: the kernel
      locks buses 0-2 only, and all RTOS lock takes go through FUN_8006bfdc
      (users: log 25, DVFS 28, debug shell).
    address_space: rtos and linux-kernel
    evidence:
      - ev_e6fcb422c3a4799dcee25785aac4f3f7f8c6c9109b75b360dc0e0c2b80b88cd1
      - ev_29f6ac7eefc37fd16b654a65ebe0e3ed28fd5414ffd5ea64d096163e1e1546fd
      - ev_a23c3f24e4727904678e3da7a2e253bffc898f6da723b9dc318f6cc3a02fd5be
      - ev_f0baaddc2f62a16bf9d90476083ecd31313e9fcdafb8ca6c7c96393984b6f848
    not_proven:
      - concurrent use of these controllers by both systems, or a collision
      - Linux bus 3 or 4 activity inside the liveview-restart window
      - interrupt routing of lines 72 and 73 between the processors
      - any link to the gyro-handler outcome rule
    detail: output/decompile/rea/pass-rtos-locks-20261103/RESULT.md

