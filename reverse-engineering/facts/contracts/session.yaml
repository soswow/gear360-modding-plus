    statement: >
      In the RTOS, runHandler (FUN_800ebe00) calls the handler in slot id+2
      of the command handler table without checking it. The handler factory
      setup (FUN_800ebf88) puts CCmdCaptureNormal in the slot of
      CAPTURE_COMMAND_STILL_NORMAL (id 0xa) and the base class CHandlerNX1 in
      the slot of CAPTURE_COMMAND_STILL_BRACKET (id 0x27); CHandlerNX1's
      precondition, body and post methods each return 0 and do nothing. No
      bracket command class exists in the image. So a bracket request (WB,
      PW or AE) is accepted and ignored on this camera, as step 5d showed,
      and RecipeBracket cannot be started.
