      when the 32-bit word at 0x85180000 is nonzero, while the "done" log at
      0x80237744 is still emitted. FUN_8023013c has four callers, all in the
      sensor-driver region: FUN_80237894 (which calls the driver's SetMode
      virtual at slot +0xAC after it), FUN_8023fc94 (which does the same under
      a mode test), FUN_80240400 (the driver's SetMode, itself proven by the
      log tag "SetMode" under the module tag CAP_FE, which skips the call when
      its local flag is zero and retries it on a frame error), and FUN_80245950
      (the module's I2C core, which owns the CIS_WRITE and CIS_READ strings).
      StartCapture reaches the already-traced shallow path twice, both routes
      converging on FUN_800bda58: directly via FUN_800ba588 when the capture
