  - id: session.rtos-log-record-layout-and-pointer-destination-20261102
    status: accepted
    kind: static
    statement: >
      In the pinned carrier the RTOS's logutil_force_save (FUN_80048cd0) builds
      a 0xa4-byte record and then calls the ring append (FUN_80048e7c) and the
      shared send (FUN_80049110) in that order. The record holds an 11-byte tag
      at +0x00, the formatted message at +0x0c (at most 0x80 bytes), the
      message id at +0x8c, an eight-byte timestamp at +0x90 and +0x94, the
      level at +0x98, a masked counter at +0x9c and the pid at +0xa0. The ring
      is 0x400 entries of 0xa4 bytes, addressed by index * 0xa4 + 0x8144b96c
      (FUN_800490bc), with the index at DAT_81474d6c, and each slot carries a
      one-byte present flag; FUN_80048e0c clears 0x29404 bytes from
      0x8144b96c at the one-time init. The ring's read side is FUN_800492f0 and
      FUN_80049258, which walk the ring and call FUN_800491a0 for each slot
      whose present flag is set. FUN_800491a0 formats the record into a text
      line and prints it with FUN_80011e70, the RTOS's console printf, in the
      form "[%2d:%5lu.%06lu] I/%-12s (A7%3d): %s\n". The shared send is
      FUN_80049110 -> FUN_8051eec4("source/logBuffer.c",
      "LogBuffer_SendPrintEx",0x136,0x81c11c3c,0x20); FUN_8051eec4 rejects a
      null pointer or a null *pointer and then calls
      FUN_80517eac(**0x81c11c3c, 0x20), and FUN_80517eac is a single
      software_interrupt(6) whose only arguments are the destination and the
      length. The LogTask (FUN_8004939c) waits on the same object and reads an
      event-flag word from it with FUN_8051efa8 and acknowledges it with
      FUN_8051f0b0, both of which are given 0x81c11c3c, and the one-time init
      FUN_80049540 hands 0x81c11c3c to FUN_8051ecdc at LogTask_Initialize and
      creates FUN_8004939c as a task. 0x81c11c3c is therefore an event-flag
      control block in the RTOS's own memory that only wakes the LogTask; the
      record is never deposited there, it is formatted and printed to the
      RTOS's console. Every record is additionally gated on
      FUN_800486dc("source/log.c","logutil_force_save",0x1d6) returning a
      value greater than zero; that function queries the calling thread's
      level (FUN_80517df8, itself a software_interrupt(6)), returns 0 when the
      level word is 4 and 0xffffffff on its error path, and the decompiler
      leaves the remaining path's value indeterminate.
    address_space: rtos
