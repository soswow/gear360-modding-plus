  - id: session.rtos-startmovie-sizes-rates-and-stop-20261107
    status: accepted
    kind: static
    statement: >
      Fresh REA on the pinned carrier: the RecordMovie dispatcher
      FUN_8004f7fc sends 0x1020001 to StartMovie FUN_8010ec68 and 0x1020002
      to StopMovie FUN_8010f30c. StartMovie reads payload words 0-3 only. It
      accepts 4096x2048, 2880x1440, 2560x1280, 1920x960, 1440x720,
      1920x1080, 1280x720 and 1280x640 (user value 0x36 = 0x360000-7) and
      frame rates 12.5, 15, 24, 25, 30, 50, 60, 100, 120 (user value 0x37);
      anything else logs and returns -3 (0xfffffffd). It then writes 0x36
      and 0x37, sets the capture object's +0x2c to 1, sets user value 0x135
      to 1 when word 3 is 1, and posts state event 0x3a. StopMovie runs only
      with +0x2c = 1: it clears it and 0x135 and posts event 0x3b; otherwise
      it publishes 0x1030002 and returns -1.
    address_space: rtos
    addresses:
      dispatcher: "0x8004f7fc"
      start_movie: "0x8010ec68"
      stop_movie: "0x8010f30c"
    evidence:
      - ev_f30353f80d4b2bb587e97555462aacf298c7cc35f51acd0960fa94d00323d11a
      - ev_0904181e137152166072196711a63719f8b21bab0a6a2ed4b154aa811ab2173d
      - ev_08892de5e00e42a4b55e1aa40d0dde2feca21d7f93b96d243d9eb2e2dcd7c3d4
    not_proven:
      - what events 0x3a and 0x3b do, or what state a still needs after 0x3b
      - whether user values 0x36/0x37 change a later still
      - that FUN_8053e338 is an exact float equality
    detail: output/live-preview-T20/RESULT.md

  - id: session.image-route-block-layout-from-stock-consumer-20261107
    status: accepted
    kind: static
    statement: >
      The stock consumer reads the image route's block (stCAPTURE_IMAGE)
      as: +0x00/+0x04 buffer width and height, +0x08/+0x0c picture width
      and height (a zero in any rejects the frame), +0x10/+0x14 copied
      uninterpreted, +0x38/+0x3c the YUV kind, +0x40 the address type,
      +0x54 the mapped Y address, the chroma at +0x58 for types 5 and 7, at
      +0x5c for type 6 and at Y + bufW x bufH for type 0, +0x64 the side
      (1 single, 2 left, 3 right) and +0x68 a 64-bit timestamp
      (cMmfCamera::VideoCallback, DisplayExtCallback, ThumbnailCallback).
      The "second mapped address" at +0x58 that capture_session_library.h
      leaves unresolved is therefore the chroma plane of a 4:2:0
      semi-planar buffer. The consumer keeps five frame records and
      releases nothing in the callback.
    address_space: linux-mmfmodules-elf
    evidence:
      - ev_575b34a7755de2252bf7fb0a6225a0ecf3fa40475363748b5787485803dfed85
      - ev_8ef12cca705091bcad335c69ecb05da301cf94bbba928d6a9d7a2ffe861d03af
      - ev_e962d8ab0c9285655d68d42a8f1438f986885410c98ac6b43f67486a3ea31cbc
    not_proven:
      - the meaning of +0x10/+0x14 and of the +0x38/+0x3c values
      - that the layout holds for frames delivered to our client
    detail: output/live-preview-T20/RESULT.md

  - id: session.own-client-movie-preview-then-still-20261107
    status: accepted
    kind: runtime
    statement: >
      On boot 139ef0e1 (uptime 4080 s, stock app inactive, g360-app stopped
      for the run and restarted after; no power cycle) g360-preview opened
      the capture library like g360-shot and sent RecordMovie(0x1020001,
      {1280, 640, 15.0f, 0, 0, 0, 15.0f}, 28); it returned 0 and
      E_CAP_NOTIFY_LV_VIDEOSTART_DONE (0x2030001) arrived 230 ms later.
      Frames came only on the image set 0x4010007 (none on images
      0x3030001/2/3): 296 in 10 s, 29.95 per second by arrival, each
      1280x640, address type 7, YUV kind (0, 3), side 1, physical Y/C at
      +0x44/+0x48, mapped Y/C at +0x54/+0x58 (C = Y + 1280x640), byte size
      0x12c000 at +0x74, readable in our process. The planes are NV12 (Cb
      first): converted, they give a correct dual-fisheye picture. A
      g360_capture during the preview was refused by the library.
      RecordMovie(0x1020002, 0, 0) returned 0 and VIDEOSTOP_DONE (0x2030002)
      came 14 ms later; a normal still then delivered its image set in
      0.72 s (main JPEG 3,466,058 bytes) with every buffer given back. The
      camera log shows StartMovie/E_CAP_CMD_MV_START and StopMovie/
      E_CAP_CMD_MV_STOP with their notifications; the kernel log has no
      fault. On the camera a 1.2 MB frame copy took 19 ms (mean), and
      libturbojpeg q75 took 18 + 33 ms at 640x320 and 59 + 82 ms at
      1280x640 (conversion + compression).
    address_space: linux-capture-elf
    evidence:
      - output/live-preview-T20/trial-01/RESULT.md
    not_proven:
