  - id: session.bridge-listener-unsubscribe-gate
    status: accepted
    kind: static
    statement: >
      The pinned bridge's listener Broadcast and Unsubscribe use the same
      holder+0x2c0 semaphore. Broadcast holds that gate across the client
      callback, passing category,body,length in three argument registers.
      Unsubscribe takes the gate before removing/compacting matching
      callback entries. With a valid successfully acquired mutex-like
      gate, external unsubscribe serializes against this dispatch path.
      Calling unsubscribe from that callback would reenter the same gate.
