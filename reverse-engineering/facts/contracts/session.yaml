  - id: session.stock-waiter-takes-0x81-request-late-answer-survives-20261103
    status: accepted
    kind: observation
    statement: >
      With the stock app running and only its MCB_Receiver and MCB_Sender
      stopped by ptstop (udd_ipcc_fmt_in left waiting in /dev/d5_ipcc), our
      probe's still request was followed by an adjust batch that our library
      answered (pid 1084). The RTOS's 0x81/0x020b still-expansion/gyro
