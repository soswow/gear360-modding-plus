  - id: session.receiver-main-clears-status-byte-and-continues-loop
    status: accepted
    kind: static
    statement: >
      Pinned bridge CReceiver::t_Main at Ghidra0x169f4 calls its initial
      helper, then retries semaphore-get(this+0x314) on any nonzero result.
      A zero result writes byte1 to this+0x324, calls the bound receive
      method, writes byte0 there and unconditionally branches back to
      semaphore-get. Its checked88-byte body has no local stop predicate
