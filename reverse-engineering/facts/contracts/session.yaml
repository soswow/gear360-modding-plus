  - id: session.rtos-log-destination-is-outside-the-linux-shared-window-20261102
    status: accepted
    kind: observation
    statement: >
      The camera-safe log-read probe read the shared preference window on a
      healthy camera (stock application running, no application stop, no power
      cycle, no still, the camera unchanged before and after): the known
      boot-type preference at offset 0x1268 read 1, and the sixteen words at
      offset 0x11c3c read zero. A second probe dumped the whole 0x81000-byte
      window twice, half a second apart: 299314 non-zero bytes of binary
      structure, no printable run of eight or more characters anywhere in the
      window, and the two dumps byte-identical. The 0xff fill that begins at
      exactly offset 0x34320 is the RTOS initializer's guarded clear at RTOS
      0x85400000+0x34320, so the window's RTOS base is 0x85400000 and a
      window offset equals the RTOS address minus 0x85400000. The RTOS's log
      destination 0x81c11c3c is therefore 0x38EE3C4 below the window, not at
      offset 0x11c3c; the handoff's offset followed from a window base of
      0x81b00000, which the device contradicts. This supersedes the
      rtos-log-ring-and-shared-send-20261102 claim, whose static half (the
      0x400-entry ring, the index DAT_81474d6c, the entries through offset
      0x7eb8b694, LogBuffer_SendPrintEx at 0x8051eec4 with destination
      0x81c11c3c and length 0x20) still stands and whose readability
      inference does not.
    address_space: linux-shared-window
    addresses:
      window_base_rtos: "0x85400000"
      window_physical: "0x85400000"
      window_length: "0x81000"
      log_destination_rtos: "0x81c11c3c"
      guarded_clear_offset: "0x34320"
    not_proven:
      - that the RTOS's log is unreachable by every other Linux route
      - the runtime state of the RTOS's own log ring or the ring's read side
      - the cause of the still's death
    detail: output/decompile/rea/pass-log-read-probe-20261102/LOG-READ-PROBE-RESULT.md

