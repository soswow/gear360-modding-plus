  - id: session.app-wakeup-is-modechange-ioctl44-20261101
    status: accepted
    kind: static
    statement: >
      In the pinned stock application, UI_Mm_Camera_Set_Wake_Up at 0x117870
      ends in the helper call FUN_00113ef8(0x44, 0, 0). The helper
      (0x113ef8, the same one the PowerSave wrapper uses) calls mm_camera_ioctl
      on the app handle with those arguments, so the wakeup is the ioctl
      selector 0x44 with null arguments. The library mapper maps 0x44 to
      0x1070004, whose OperateCapture arm sends SendCommand(0x104, 4, 0);
      the RTOS OP dispatcher routes 0x1070004 to CCapCmdIf::ChangeMode with
      the mode word 0, which selects controller mode 3. The application's
      boot wakeup is therefore the OP mode change to controller mode 3, and
      it is fire-and-forget (the helper only logs a nonzero return). A bare
      client that never issues it runs the still's boot-default drive branch.
    address_space: linux-app-elf
    addresses:
      set_wake_up: "0x117870"
      ioctl_helper: "0x113ef8"
      selector: 68
    not_proven:
