  - id: session.lock-28-guards-shared-pmic-bus-2-20261103
    status: accepted
    kind: observation
    statement: >
      Read-only sysfs and /proc on the camera: Linux I2C bus 2 (controller
      0x10034200, IRQ 71) carries the PMIC s2mpm03 at 0x41, which supplies
      VDD_ISP, VDD_TOP, VDD_LPDDR and the sensor rails. The RTOS DVFS logs
      pmic_s2mpm03_set_voltage(i2c_ch=2, ...) and takes lock 28, and the
