  - id: session.rtos-ep-acc-dispatch-and-jpeg-retry-20261103
    status: accepted
    kind: static
    statement: >
      The RTOS image-engine top init FUN_8002e434 installs handlers on
      interrupts 0x2e, 0x2f, 0x30, 0x32 (46, 47, 48, 50), the same lines
      Linux's drime5_ep driver requests; the acc handler FUN_804f97a0 is on
      50. It reads the acc status 0x208210d8, and for each bit also set in
      the RTOS shadow mask 0x81c09324 calls the slot callback (table
      0x81c094e0) and clears the bit (0x20821060), then writes
      end-of-interrupt to 0x07f02010. The RTOS programs a GIC distributor at
      0x07f01000 (FUN_80013c54). Only enable, disable, the dispatcher and the
      clear-all FUN_804f94bc touch the shadow; the clear-all also zeroes
      0x20821080 and the callbacks. The JPEG error callback (slot 2,
      FUN_801b9214) marks the encode failed, and the done check then runs
      Jpeg_Encode_Retry (FUN_801b8450): a software reset of image-engine
      block 13 (FUN_80269df4(0xd)) and a re-encode with a 2 s wait.
    address_space: rtos
    evidence:
      - ev_23c3ba2ede7eb3de32c6b8f6eea9c4d5a9b5a65dc6e8515fc3f83963b1903af5
      - ev_eadde398cdeca52013901875f2ae4c540cf4e0cad8ae53acd5eac00a985ae16e
      - ev_0fbe7012dd7677a958c06584d1223be74a87087888bcfa56a60e7d2fed0711e7
      - ev_2c9e6e019948d184ce3c7c3bdb8cb400dcd28860b427558b9fa03dcccf315bff
      - ev_3c0ad1487898674aeaad54966e1c28c48effc81cba329aae6d1bc66fe03c131d
    not_proven:
      - whether the RTOS and Linux GICs are separate controllers
      - whether the main encode ends in error in a death
    detail: output/decompile/rea/pass-rtos-episr-20261103/RESULT.md

