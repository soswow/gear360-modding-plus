  - id: session.image-set-delivery-is-stack-descriptor-20261101
    status: accepted
    kind: static
    statement: >
      In the pinned capture library, CCapImageSetCb::OnCallback at 0x7f004
      dispatches on the internal topic and invokes the registered app-facing
      image-set callback as (*cb)(public_topic, &local_e60, 0, 0), where
      local_e60 is a local stCAPTURE_IMG_SHARED_SET pointer in the library's
      own stack frame and the third and fourth words are literal 0. The
      552-byte descriptor carries the geometry and pixel address (offsets
      +0x98/+0x9c width/height, +0x90/+0x94 strides, +0xe4 pixel virtual
      address). So the image-set channel delivers a stack-local descriptor
      that is valid only during the call and must be copied synchronously;
      the library transfers no ownership, and the pixels are reached through
      the image object's buffer/virtual-address accessors, not through this
      callback.
