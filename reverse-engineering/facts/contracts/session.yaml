  - id: session.kernel-ipcc-fmt-wait-global-single-consumer-queue-20261103
    status: accepted
    kind: static
    statement: >
      The d5_ipcc misc record 0xc07ab700 binds file_operations 0xc059f358,
      whose ioctl slot is 0xc03c9dc8. Command 0x80087409 (0xc03ca380) sleeps
      interruptibly on the global wait queue 0xc07ab69c while the global
      counter 0xc084f3a0 is 0. Then, with IRQs disabled, it pops one record
      (counter -1, read index +0x54 modulo 10), copies its 8 per-line flag
      bytes to the caller and clears them. The per-line kernel callback
      0xc03cace8 (stubs 0xc03cade0/d8/d0/c8 for lines 0/4/5/6, registered
      through ipcc_fmt_int_set_callback 0xc03c9ce0 at 0xc03ca16c-0xc03ca1ac)
      appends one record with only that line's flag set, wiping all pending
      records first when 10 are pending. It then calls
      __wake_up(0xc07ab69c,1,1,0). ipcc_fmt_irq_handler 0xc03c9be0
      dispatches the line callback from table 0xc084f380 unless the byte at
      +0x7ff of its shared area is 0xbb, then calls the back-end slot +0x14.
      Each interrupt record therefore reaches exactly one waiting process,
      whichever pops it first.
    address_space: linux-kernel
    addresses:
      ioctl: "0xc03c9dc8"
      wait_case: "0xc03ca380"
      push: "0xc03cace8"
      queue_counter: "0xc084f3a0"
      wait_queue: "0xc07ab69c"
      fmt_irq_handler: "0xc03c9be0"
      fmt_int_set_callback: "0xc03c9ce0"
    evidence:
      - ev_0fb3fa03b418bbe4c7021336422026f35489821013b29c168ab8397aef6aa393
      - ev_f798e1c67b766ea7c2cf7369930711aebc8063edb13a2cbfd91030da630bbc1e
      - "REA inspect_native_instruction walk 0xc03c9dc8-0xc03c9ed0, 0xc03ca120-0xc03ca1f0, 0xc03ca380-0xc03ca524, 0xc03cacd0-0xc03cae00 (listings k-walk-*.txt, local)"
    not_proven:
      - which hardware lines the RTOS raises during a still or liveview start
      - exclusive versus non-exclusive waiter wake-up (one record per pop either way)
    detail: output/decompile/rea/pass-static-ipcc-routing-20261103/RESULT.md

  - id: session.udd5-interrupt-callbacks-are-process-local-20261103
    status: accepted
    kind: static
    statement: >
      libudd5 handle_interrupt (ELF 0x92a4) names its thread
      udd_ipcc_fmt_intr_handler, loops on ioctl 0x80087409 for context 0
      (0x8018740a for context 1), and for each set flag among 8 lines calls
      the process-local callback slot only if it is non-null.
      d5_register_isr (ELF 0x9ea4) stores the callback in that table and
      creates the thread once, with no kernel call. The first open (ELF
      0x460f0) issues ioctl 0x7408. A process that pops an interrupt record
      for a line it has no callback for drops it.
    address_space: linux-udd5-elf
    addresses:
      handle_interrupt: "0x92a4"
      d5_register_isr: "0x9ea4"
      first_open_init: "0x460f0"
    evidence:
      - ev_9cc14a68009f8736a2aa2f899766c6f70097dd3b732880cdd4c0b844e5de84de
      - ev_ec131543c000f2ffdcee295d1a19ba3c79bad7b17baead6994ede6c485234215
      - ev_40b05e10f33c17cb5aea7ecbc27f2989f2c62ddd3acaa3aba4e6c1d35d120828
    not_proven:
      - the kernel meaning of ioctl 0x7408
    detail: output/decompile/rea/pass-static-ipcc-routing-20261103/RESULT.md

  - id: session.ipcc-interrupt-line-registrants-20261103
    status: accepted
    kind: static
    statement: >
      Only libmulticore-bridge, libaudioutil and libmmfmodules in the dump
      import ipcc_int_set_callback; none imports RegisterRawInterruptHandler
      or Mcb_register_raw_int. libmulticore-bridge CIPCCDriverIf::initialize
      (ELF 0x50e4) registers line 0 to CIPCCDriverIf::OnInterrupt (ELF
      0x5054), which calls the receive listener; CReceiver::OnInterrupt (ELF
      0x679c) only posts the receiver semaphore. libaudioutil registers line
      5 in aac_enc_init (ELF 0x2234) and aac_dec_init (ELF 0x3acc), which
      also load AAC firmware into the M4. libmmfmodules registers line 9
      (raw group) in ipccInit (ELF 0x2b4c4) and ipccDecInit (ELF 0x2bb3c)
      for HEVC. The stock app's dependency closure includes libaudioutil and
      libmmfmodules; our probe's does not.
    address_space: linux-bridge-elf, linux-audioutil-elf, linux-mmfmodules-elf
    evidence:
      - ev_4f8995278ab60189bcab8536c629ab6c00ceb48e7eb2bffb7012628995f7f36f
      - ev_72ef77f6c6f9c9235ca39b0319018b31851b1cb1e5068d5473f9d0cb81b269cf
      - ev_3faeace8b55ede29709d955babb0420d049cd359c6f84d4c5e5638ffeb7797fb
      - ev_48f7d143d570a8af8e81974b09ee0f8a035f6920f0cca0601c0cc46924d7116c
      - ev_445c1c348778d30145c45f4f3d21470f0db0c45e192efd1125763dd6cfc58000
      - ev_ee940c4dcf2e97f5f820ac51a21fb1ce979e39483d2d3a66bc960b013a2ff534
      - ev_a349b7d21003ee6aa4083a5765816cbd8e1eacf2e964f76632f038ed35f98b74
    not_proven:
      - whether the stock app initializes the AAC or HEVC codec in photo mode
    detail: output/decompile/rea/pass-static-ipcc-routing-20261103/RESULT.md

  - id: session.gyro-mode3-handler-is-stateless-20261103
    status: accepted
    kind: static
    statement: >
