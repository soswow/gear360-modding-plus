      - the runtime effect of the wakeup on the camera's RTOS state
    detail: output/decompile/rea/pass-liveview-contract-20261030/next-edge/still-path/MODE-CHANGE.md

  - id: session.app-lock3a-before-still-20261101
    status: accepted
    kind: static
    statement: >
      In the pinned stock application UI_Mm_Camera_Start_Lock3a at 0x119008
      builds a 0x10-byte payload - word 0 is the param, word 1 is a
      type-derived word (type 2 gives 1, type at least 5 gives 2, otherwise
