  - id: session.rtos-log-stream-not-in-linux-dlog-20261031
    status: accepted
    kind: static
    statement: >
      The camera's dlogutil reads the Linux log streams only. Its own
      strings name the device template /dev/log_%s with the stream set
      main, radio and system, and /dev/log_main; dlog_logger names
      /dev/log_main, /dev/log_radio, /dev/log_system and /dev/log_apps.
      The RTOS-side tags used by the capture code, CAP and CAP_CTRL, do
      not appear in any raw dlog capture retained by this project, only in
      Markdown reports quoting them, while every raw capture contains only
      Linux-side tags such as CAP, CAP_BTLOG, DEVICED and DEVICE_NODE.
      Therefore the absence of an RTOS liveview line in a Linux dlog
      capture is not evidence that the RTOS did not emit it, and the RTOS
      log stream cannot be read with the Linux dlog utility.
