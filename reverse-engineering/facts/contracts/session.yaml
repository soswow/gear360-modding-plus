  - id: session.rtos-capture-ready-is-gated-flag-20261101
    status: accepted
    kind: static
    statement: >
      In the pinned carrier image, CCapturePublisher::NotifyCaptureReady at
      0x8006ed14 reads a flag byte at the publisher object's +0x64 through
      FUN_8006f02c, which returns *(param_1+0x64). When the flag is zero it
      logs "%s is skipped capture_ready." and returns without sending; when
      nonzero it sends the still completion on topic 0x1010007 and then
      clears the flag through FUN_8006effc, which stores param_2 at
      *(param_1+0x64). FUN_8006effc has three callers, NotifyCaptureReady
      itself (clear), 0x800f09e8 and 0x80274524; FUN_8006f02c has five
      readers. The still completion producer CResLiveview::sendCaptureReady
      at 0x800f8b80 calls NotifyCaptureReady only when its readiness check
      FUN_800f8e98 returns nonzero and, depending on capture type, a state
      check FUN_8025b0dc holds. So the id-7 completion is gated by an
      internal flag and by capture-type and readiness conditions, and is not
      emitted unconditionally.
    address_space: rtos
    addresses:
      notify_capture_ready: "0x8006ed14"
      flag_getter: "0x8006f02c"
      flag_writer: "0x8006effc"
      send_capture_ready: "0x800f8b80"
    evidence:
      - ev_267c347ddf8ac2c96bbeb4c30382b3ece1bb0b4771476c0be29ca8160f4d844c
      - ev_6f799a502d6679c740ba311d3870d5bf439ff968479e46ac135b5523b76cbc5d
