  - id: session.liveview-start-transport-failure-chain-20261031
    status: accepted
    kind: static
    statement: >
      In pinned capture library the LV_START ioctl arm calls the thunk0x389bc,
      which the provider resolves as a thunk to ControlLiveview0x537dc.
      ControlLiveview dispatches on the topic, and its LV_START arm0x1030001
      logs E_CAP_CMD_LV_START and Liveview on start! and then calls
      CMCBAdapter::SendCommand with attribute0x301 and length0x1c, that is 28
      bytes. CMCBAdapter::SendCommand0x9abc8 forwards to
      CMulticoreBridge::Send with category0x83, and the bridge CSender::Send
      0x179a8 admits a send only when the category is0x10 or the
      destination-alive byte m_bDestAlive is nonzero. Category0x83 does not
      qualify for the0x10 bypass, so when that byte is zero the frame is
      queued and the call returns -1, the same value that the library's
      per-arm status word converts to the0xFFFFFFFF ioctl sentinel. The
      library logs Liveview on start! before the send, so that line does not
      indicate the command was transmitted.
    address_space: linux-app-and-capture-elf
    addresses:
      ioctl_arm: "0x3e1e8"
      thunk: "0x389bc"
      control_liveview: "0x537dc"
      send_command: "0x9abc8"
      bridge_send: "0x179a8"
    not_proven:
      - that the destination-alive byte was zero at the time of the trial
      - that the RTOS received or rejected the command
      - any successful liveview start from an independent client
    detail: output/decompile/rea/pass-liveview-contract-20261030/NEXT-EDGE.md

  - id: session.destination-alive-writers-are-not-capture-events-20261031
    status: accepted
    kind: static
    statement: >
      In the reviewed bridge, CSender::SetDestinationState0x17340 stores the
      destination-alive byte directly. The provider reports its callers as the
      thin thunk0x146e4 and, through it, CMCBListenerHolder::Broadcast0x16128
      and mcb_set_ignore_init_checking0x164b8, the latter doing nothing but
      SetDestinationState(true). The pinned capture library never writes that
      byte: it has no ignore_init symbol and its only bridge imports are
      mcb_register_handler, mcb_send, mcb_init and the two debug-name
      setters, and its bridge traffic goes out through CMulticoreBridge::Send
      without setting the latch. So the latch rises only on an incoming
      category0x10 broadcast or on an explicit local bypass call, neither of
      which is a capture event.
    address_space: linux-bridge-elf
