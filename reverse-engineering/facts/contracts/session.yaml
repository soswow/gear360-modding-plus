    statement: >
      In the pinned carrier image the still's death mechanism is a
      buffer-starvation power-off, not a panic. The starvation handlers
      FUN_800ee424 and FUN_800ef570 (identical bodies) take the param 1
      (the RAW starvation) to FUN_800feb14(1), a stop notification on topic
      0x1010008, and the log "Capt::RawBufferStarved", and the param 3 (the
      JPEG starvation) to FUN_800feab4(1) and "Capt::JpegBufferStarved".
