  - id: session.ep-dma-mux-blocks-not-jpeg-and-lock3-20261103
    status: accepted
    kind: static
    statement: >
      The DMA path teardown that resets image-engine blocks 10 and 11 is
      called only from the putDmaMux methods (read/write DMA mux release) of
      the LDC, noise-generator, resize and 3D-LUT backends, so blocks 10/11
      are the shared DMA-mux engines. libudd5's d5_ep_demux_* list covers
      resize, LDC, noise generator, 3D-LUT and MC, not the JPEG encoder; its
      d5_ep_jpeg_reset resets only the JPEG DMA (+0x800) or core (+0x000).
      The JPEG completion's slot disable (FUN_804f585c) first takes lock 3
      through FUN_8002e87c(3, 500) -> FUN_80517bdc (T-Kernel svc 6); exactly
      12 functions take that lock, the enable/disable/clear-all of the
      core A, core B, DMA high, DMA low and acc interrupt groups.
