  - id: session.linux-shares-ep-acc-interrupt-with-rtos-20261103
    status: accepted
    kind: static
    statement: >
      Linux drives the same image engine. libudd5 d5_ep_open maps the
      drime5_ep register windows (0x20820000-0x2082bfff) into the process,
      and its first open per process writes 0x101ff to 0x2082100c and
      zeroes the RDMA/WDMA start-FSM timeouts; _udd_ep_acc_int_enable ORs
      bits into 0x20821080 directly. Importers of d5_ep_*: the X server
      driver drime5_drv.so (including sw_reset and clock_onoff),
      libmmfmodules.so and libtint-util.so. Our probe's library set
      includes libtint-util, but the capture library imports none of its
      symbols, its constructors do not open the engine and libudd5 never
      calls d5_ep_open itself. The kernel drime5_ep probe requests the
      core A, core B, acc and DMA interrupts at boot; the acc handler
      FUN_c03c6de4 acknowledges and clears (ep_top+0x1060) every status bit
      in Linux's mask 0xc084ecf4, or all bits when *(*0xc07ba7a8+0x334)==1.
      The EP ioctls 0x40046810/0x40046811 set or clear a bit both in that
      mask and in the shared enable register 0x20821080. The stock app's
      strace of a stock still has no image-engine ioctl.
