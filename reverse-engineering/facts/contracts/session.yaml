      FUN_801006b8 with the name "turnOff", FUN_800e91cc(..., 1), emits the
      topic 0x1070001, and logs "CaptureController : Start Power Off". The
      buffer allocators log the failure:
      CCaptureMemoryManagerNX::checkRawBufferFull - Cannot alloc SSIF
      buffer! (0x8061b8ac) and CDriveBaseNx::checkBufferFull - Cannot alloc
      SSIF buffer! (0x8067d1fc). The bare client never allocates the SSIF
      buffers, so the drive's capture starves within ~0.5 s of
      STL_CAPTURE_START and the camera powers off; the bare liveview's ~5 s
      death is plausibly the same mechanism with a slower fill.
