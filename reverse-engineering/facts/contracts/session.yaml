  # Observed on the camera, 2 November 2026 (ACTIVE_PLAN.md steps 1-3).
  - id: session.rtos-console-log-readable-via-devmem-20261102
    status: accepted
    kind: observation
    statement: >
      The RTOS console log is readable from Linux. `st cap log` (Samsung's
      own command, used by /usr/bin/save_log_info.sh) maps physical
      0x85300000 through /dev/mem (8 bytes, then 0xC0000 bytes) and prints
      it: timestamped lines tagged CAP_CTRL, CAP_MEM, CAP_FE, CAP_LV, PWRCTL,
      SENSOR_DRV_LOG and others, from RTOS boot to the present. Header word 1
      (+4) is the write position into the text that starts at +8; unused
      bytes are 0xff. read() on the range fails; mmap works. Output of
      forwarded `st cap ...` commands also lands in this log. The read-only
      poller tools/observe/rtoslog.c follows it at 10 ms.
    supersedes_inference_in:
      - session.rtos-log-destination-is-outside-the-linux-shared-window-20261102
    detail: output/decompile/rea/pass-plan-step1-rtos-log-20261102/RESULT.md

  - id: session.ipcc-live-rings-a-b-20261102
    status: accepted
    kind: observation
    statement: >
      In the shared IPCC window at physical 0x02010000 exactly two rings were
      live: ring A (write +0x4c, read +0x50, data +0xec, 395 bytes) carries
      RTOS-to-Linux frames, ring B (write +0x54, read +0x58, data +0x277,
      395 bytes) carries Linux-to-RTOS frames (the `st cap` shell commands,
      category 0xb6, appear in it). The cursors at +0x94 and +0xa4 read zero.
    detail: output/decompile/rea/pass-plan-step2-ipcc-record-20261102/RESULT.md

  - id: session.stock-still-message-exchange-20261102
    status: accepted
    kind: observation
    statement: >
      One stock still (stock app in liveview, `st key click s2`) exchanged 24
      ring frames. Linux sent the 48-byte still request (cat 0x83 attr 0x0201,
      first word 0x01010016, free-card bytes as a 64-bit value). The RTOS
      then sent six requests cat 0x82 attr 0xaa06 (payload 0x814752a0), each
      answered by Linux with cat 0x83 attr 0xaa0b (values 0 or 0xffffffff);
      the gyro/expansion request cat 0x81 attr 0x020b at +243 ms, answered
      5 ms later with cat 0x83 attr 0x0210 value 9 (RTOS log: "GET A9 SENSOR
      DATA SUCCESS/DONE"); and the image-set notification cat 0x81 attr
      0x0201 at +485 ms. At +1.1 s Linux returned four buffers with cat 0x83
      attr 0x020c (id, address): 5/0xaa004000, 7/0xaf868000, 8/0xb0a34000,
      9/0xaa434000. The RTOS log shows the RAW written by PP WDMA to
      0xa6000000, 5824x2896, stride 11648, 12-bit.
    not_proven:
      - which Linux code answers 0xaa06 and what 0 and -1 mean
      - whether a missing reply is what kills our client's still
    detail: output/decompile/rea/pass-plan-step2-ipcc-record-20261102/RESULT.md

  - id: session.graceful-stop-sends-nothing-to-rtos-20261102
    status: accepted
    kind: observation
    statement: >
      A graceful `systemctl --no-block stop di-camera-app.service` of the
      stock app produced no IPCC frame on rings A or B and no RTOS log line;
      the RTOS stayed in liveview. This contradicts, for this stop, the static
      chain in session.rtos-power-state-gates-liveview-and-still-20261101 and
      the trial-06 diagnosis that a graceful stop puts the RTOS in power
      state 3.
    detail: output/decompile/rea/pass-plan-step3-restart-control-20261102/RESULT.md

  - id: session.manual-app-start-enters-hibernation-20261102
    status: accepted
    kind: observation
    statement: >
      The stock app started with `systemctl start` after boot logs "CAPTURE
      MODULE ALREADY INITIALIZED", registers its callbacks, then "hib()
      start..." and loops on "can't umount(/opt)" / "DO NOT LOGIN SHELL until
      f/w-upgrade is done!": it tries to create the hibernation boot snapshot
      and never reaches shooting mode (a software shutter did nothing). It
      ignored SIGTERM and systemd killed it at the 90 s stop timeout. Never
      restart the stock app this way; power-cycle the camera instead.
    detail: output/decompile/rea/pass-plan-step3-restart-control-20261102/RESULT.md

  # ACTIVE_PLAN.md step 4, 2 November 2026 (two client trials, one stock control).
  - id: session.client-still-dies-by-power-cut-at-liveview-restart-20261102
    status: accepted
    kind: observation
    statement: >
      With the stock app gracefully stopped, our client sent the stock app's
      exact still request (0x01010016, Cap=Max=1, remaining 2440) and the
      library in our process answered the 0x82/0xaa06 adjust requests and the
      gyro request by itself. The RTOS completed the still (RAW to 0xa6000000,
      processing, high-ISO NR, stitch, JPEG stage) and its log ended right
      after "[SENSOR_DRV_LOG] DisableStream" in the post-still liveview
      restart, in both trials. No "CaptureController : Start Power Off" line
      was logged. The Linux heartbeat and the RTOS log stopped within ~45 ms of
      each other, /dev/kmsg recorded no panic or shutdown, and the camera
      stayed off until the power key. A stock still in the same scene took the
      same high-ISO path and memory layout and survived, continuing with the
      sensors' frame-count polling and the JPEG image-set hand-off.
    contradicts:
      - session.still-death-buffer-starvation-poweroff-20261102
    not_proven:
      - what cuts the power, and which stock-app resource or action prevents it
    detail: output/decompile/rea/pass-plan-step4-stock-like-still-20261102/RESULT.md

