  - id: session.kernel-i2c-locks-buses-0-2-with-ids-26-28-20261103
    status: accepted
    kind: static
    statement: >
      Kernel I2C transfer FUN_c039f018 computes lock ID = adapter number +
      0x1a and uses it only when the ID is at most 0x1c, so buses 0, 1 and 2
      map to hardware locks 26, 27 and 28. Before a transfer it calls
      lock_request (0xc03cc5d4, table slot +4, back end 0xc03ccf34) every
      5 ms for up to 500 ms and prints "i2c %d lock timeout" on failure;
      after the transfer it calls lock_free (0xc03cc608) with r0 = the same
      ID. Apart from the /dev/d5_lock ioctl handler, it is the only kernel
      caller of lock_request and lock_free.
    address_space: linux-kernel
    evidence:
      - ev_f0baaddc2f62a16bf9d90476083ecd31313e9fcdafb8ca6c7c96393984b6f848
      - ev_f07c1872849b4decd1fdc4c1b1888d367cb3a506d76a6acce029a6ff6f9e0517
      - ev_21172c6305f55cf336d36aef191d3fadad1ef30c5c3ce9a0b81b2f85ea4b7bc2
    not_proven:
      - live lock contention or timeouts during a still
    detail: output/decompile/rea/pass-rtos-locks-20261103/RESULT.md

  - id: session.no-user-space-hardware-lock-taker-20261103
    status: accepted
    kind: static
    statement: >
      Only libmulticore-bridge.so imports ipcc_lock/ipcc_unlock. Its exports
      Icm_lock, Icm_unlock, mcb_lock, mcb_unlock and the CIntercoreMutex
      Lock/Unlock methods are imported by nothing in /usr/lib, /usr/bin,
      /usr/lib/driver, di-camera-app or libcapture-fw-prod.so, and inside
      the library Lock (Ghidra 0x18754) and Unlock (0x184fc) are reached
