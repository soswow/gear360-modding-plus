  - id: session.liveview-latch-zero-at-request-20261031
    status: accepted
    kind: observation
    statement: >
      In one user-authorized trial on a fresh boot, one reviewed helper with
      sha256 b764284bd0dbc83d98137fad8121ed1abca21494edc2ab7eb1ddc5203ce8acac
      read the transport's destination-alive byte in its own process
      immediately before and after one liveview ioctl with selector 0x1b.
      The byte read 0 before the request, 0 after the request and 0
      throughout the following twenty-second observation window, and the
      variable and the getter agreed at every sample. The ioctl returned
      4294967295, that is the library's 0xFFFFFFFF failure sentinel, and the
      callback count was zero. The camera dlog shows the library logging
      LV_START, ControlLiveview, StartLiveview, the outgoing
      E_CAP_CMD_LV_START and Liveview on start! before that failure.
      The byte read is the byte the send path tests, because the bridge
      getter at 0x17364 and the gate inside CSender::Send at 0x179d8
      resolve the same GOT data slot at 0x2256c, which holds 0x22ad8, the
      address of the exported _ZN7CSender12m_bDestAliveE byte. Since the
      liveview category 0x83 does not qualify for the 0x10 bypass, a zero
      byte makes CSender::Send queue the frame instead of transmitting it
      and return -1, which is the value the library converts into the
      0xFFFFFFFF sentinel.
    address_space: linux-app-and-capture-elf
    addresses:
