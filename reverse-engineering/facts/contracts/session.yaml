  - id: session.rtos-liveview-start-handler-and-length-gate-20261031
    status: accepted
    kind: static
    statement: >
      In the pinned carrier image the RTOS handler for the incoming liveview
      start command is FUN_80063160, body 0x80063160-0x8006320b, whose own
      logs name it controlLiveviewStart with the signature string
      "int CCommandHandler::controlLiveviewStart()" and whose own log tag is
      CAP. It accepts the command only when the message length field equals
      0x1c, that is 28 bytes; otherwise it returns 0xfffffffe and emits no
      log line at all, so the reject path is silent. On the accept path it
      logs "Liveview start %s" and forwards command id 0x1030001 with length
      0x1c to the executor FUN_8004f95c. The executor logs tag CAP_CTRL
      function name ControlLiveview and dispatches 0x1030001 to
      CCapCmdIf::StartLiveview at 0x8010f4f0. StartLiveview has its own
      rejections: a null payload returns 0xfffffffc, a power-off state
      returns 0xffffffff and logs that liveview is skipped because of power
      off state, and a frame size that is neither 0x140 by 0xf0 nor 0x2d0 by
      0x1e0 returns 0xfffffffd and logs "ERROR: invalid frame size, skip
      command". The generic per-command length table FUN_80051668
      independently requires length 0x1c for command id 0x1030001.
    address_space: rtos
    addresses:
      handler: "0x80063160"
      executor: "0x8004f95c"
      start_liveview: "0x8010f4f0"
      length_table: "0x80051668"
    not_proven:
