      selector 1, which the library mapper maps to 0x1040001
      (E_CAP_CMD_3A_LOCK). The RTOS CCmdCaptureNormal::checkPreCondition
      saves the still as a pending Lock3a request when the Lock3A flag byte
      is set, and handlerBody sets that flag (FUN_8054e770(1)). The stock
      application therefore issues the still after a Lock3a request, so the
      still pends while the 3A lock runs and fires on the lock completion
      against a 3A-configured sensor; a bare client that never issues the
      Lock3a fires the drive into an unconfigured sensor. The app's full op
      map (the other wrappers and selectors) is recorded in APP-OPS-MAP.md.
