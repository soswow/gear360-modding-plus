  - id: session.stock-live-stream-is-linux-mjpeg-of-movie-frames-20261107
    status: accepted
    kind: static
    statement: >
      The stock Wi-Fi preview on port 7679 (livestream_high.avi) is a movie
      recording without a file. di-camera-app's iOS case
      (E_MM_ATTR_CASE_LIVE_STREAM_IOS = 7, set_rvf_stream_attr; saved
      decompile) selects save type 2 MM_SAVE_TYPE_WIFI_STREAM, AVI and video
      codec 0xd MJPEG; every other case uses HEVC. In libmmfcore
      cMmfRecorder::SetVideoPipeline (0x53810) save-type bits 0x43 add a
      muxer named wifi-strm (bits 0/1) or usb-strm (bit 6), while
      SetRvfPipeline (0x51f1c) and SetLiveviewPipeline (0x51f14) are empty.
      The frames reach Linux as YUV: libmmfmodules cMmfCamera (client
      "camerasrc") receives them and Linux encodes the JPEGs
      (cHalMJpegVideoEncoder::Encode 0x29174 -> mmf_jpeg_encode ->
      cHalJpeg::Encode 0x310a8: tint::encodeYcc or d5_ep_jpeg_encoder, an
      adaptive quality index 0-42 against a byte budget). cRvfDlnaSink::
      SendVideoFrame (0x299c0) passes each JPEG to DlanRVFStreamBufferReady
      (libdi-network-dlna-api), the only importer of which is libmmfmodules;
      RVFStreamingThruGet in libdi-network-dlna-dmsui serves it.
    address_space: linux-mmfmodules-elf
    also_involves: [linux-mmfcore-elf, linux-app-elf]
    evidence:
      - ev_48508bb1162818f1c017bf10c89f62e94899c76851f299a28098e7d3ccbe3b75
      - ev_a85abe4e1609b4af6803bb76d4f7e0fc7fc75b3d1239d0bfed433f18fc951cd3
      - ev_91f51cafad74388582fd42d02ebe2f5e52f55b270a63eb629efc0d2d8f12ac72
      - ev_317ad6b222fbc3afb62ed489fb10f6025865e14b907b7bc6c7786f773d64a251
      - ev_2154bc9d8856e8f822aeaca4d3cd740e541fdd3f1c9a124374087707525760ec
      - ev_b8415161f06a8e40dceec0cc131b2e5de6a5ddfca756094c251a56ba885fab1e
    not_proven:
      - the movie size and stereo flag the stock iOS stream passes (observed output 1280x640, one dual-fisheye picture)
      - the di-camera-app case and codec mapping beyond the saved decompile
    detail: output/live-preview-T20/RESULT.md

  - id: session.movie-frames-client-contract-20261107
    status: accepted
    kind: static
    statement: >
      libmmfmodules cMmfCamera::Initialize (0x27184) registers client
      "camerasrc" and subscribes notifications 0x2030001, 0x2030002,
      0x2010008/9/a, images 0x3030001/2/3, 0x3010005, 0x3010007 and image set
      0x4010007. CameraControl (0x26b9c) starts with RecordMovie(0x1020001
      E_CAP_CMD_MV_START, 28 bytes {rec W, rec H, fps float, saveType==0,
      rvf W, rvf H, fps float}) and stops with RecordMovie(0x1020002, 0, 0),
      each followed by a wait for its acknowledgement: 0x2030001
      E_CAP_NOTIFY_LV_VIDEOSTART_DONE (which also reads the sensor frame rate
      with GetCaptureData(0x1080017)) and 0x2030002 VIDEOSTOP_DONE. The movie
      frames come on image topic 0x3030003 and on the set 0x4010007 (frame
      block at *(set)+0x90), both to VideoCallback; 0x3030002 goes to
      DisplayExtCallback (data type 4) and 0x3030001 to ThumbnailCallback.
      cMmfCamera::Start doubles the fps when the stereo flag is set; stereo
      frames arrive per lens (block +0x64 = 2 left, 3 right). libcapture
      RecordMovie (saved decompile, 0x52b20) sends bridge attribute 0x401
      with the 28 bytes for 0x1020001 and 0x402 with one zero byte for
      0x1020002.
