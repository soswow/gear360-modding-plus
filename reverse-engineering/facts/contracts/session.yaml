  - id: session.rtos-poweron-only-at-boot-20261101
    status: accepted
    kind: static
    statement: >
      In the pinned carrier image no Linux-reachable category handler
      dispatches the OP command 0x1070001 (DoPowerOn): the category-22
      handler hardcodes 0x1070003, and the other recovered handlers hardcode
      0x1070002/4/b/f. DoPowerOn is invoked only from the RTOS's own boot
