  - id: session.library-op-powersave-vs-local-poweron-20261101
    status: accepted
    kind: static
    statement: >
      In the pinned capture library, exported OperateCapture at ELF0x4920c
      dispatches the OP commands with per-command behavior: the 0x1070001
      (PowerOn) arm is local-only — CCapVirtualAddrIf::Instance and Start
      (the virtual-address mapper), debug-name registration, and when the
      shared pref word 0x1268 (physical 0x85401268) is zero,
      pref_rtos_set_long(0x1268,1) plus CMCBAdapter::Initialize and
      CBeautyFaceIf_Linux::GetInstance, with no send to the RTOS. The
      0x1070002 arm only waits WaitMiscEventPowerOff(5000). The 0x1070003
      (PowerSave) arm calls ClearMiscEventPowerOff then Send(0x22,0,4,mode),
      which reaches the RTOS category-22 handler and thereby DoPowerSave.
      The 0x1070004 arm calls ClearMiscEventPowerSave,
      SendCommand(0x104,4,mode) and WaitMiscEventPowerSave(3000). So the
      library's "power on" operation cannot restore the RTOS power state;
      only a boot can.
    address_space: linux-capture-elf
    addresses:
      operate_capture: "0x4920c"
      precheck: "0x61160"
    not_proven:
      - that the 0x1268 shared word influences any RTOS behavior
      - the app-side caller and its arguments for the 0x1070001 arm
    detail: output/decompile/rea/pass-liveview-contract-20261030/next-edge/still-path/POWER-STATE-CHAIN.md

  - id: session.rtos-modechange-op-command-20261101
    status: accepted
    kind: static
    statement: >
      In the pinned carrier image E_CAP_CMD_OP_MODECHANGE is OP command
      0x1070004. The OP dispatcher FUN_800502a8 routes it to FUN_80111b5c,
      whose CAP_CTRL log names it CCapCmdIf::ChangeMode ("CCapCmdIf::ChangeMode
      > Mode: %s, PBPushed: %d"): payload word 0 calls FUN_8010b6f8(controller,
      3), word 1 calls it with 2, word 2 calls it with 5, and a null payload
      returns -4. FUN_8010b6f8 is the MessageAdapter ChangeMode: it packs a
      message via FUN_80541be8 and sends it on route 0x1122 through
      FUN_800cc324; its mode-1 arm is the idle transition ("Changing to idle
      mode is FAIL." on -2). The library mapper FUN_0004317c maps selectors
      0x3f and 0x44 to 0x1070004. CCmdCaptureNormal::handlerBody reads RTOS
      status 0x43: the boot-default 0x430000 branch selects type 0x16 count 5
      (or 0x17/0x19/0x22 via the 0x134/0x46/0x51 sub-checks), 0x430003 selects
      count 4, and any other set mode selects count 2; the count is the drive
      mode passed to CDriveMode->getHandler. The bare client never issues a
      mode change, so its still always runs the boot-default 0x430000 branch.
