      a sensor power-on sequence by register writes: a first phase of
      FUN_80243928(obj,reg,value) writes (0x6010, 0x6214, 0x6218, 0x136, 0x6028,
      0x602a and a long 0x6f12 run) then a second phase of
      FUN_80243a04(obj,reg,value) writes over 0x3200-0x36xx and others; it
