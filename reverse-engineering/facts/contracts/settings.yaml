    not_proven:
      - (trial Q1 observed the camera applying 0x1e0005 and taking the no-restart branch;
        see raw.quickview-holdzoom-lens2-raw-intact-lens1-reused-20261104)
      - how the quick-view state ends without the stock app, and whether the next still works from it
        (in Q1 no capture-ready arrived within 10 s)
