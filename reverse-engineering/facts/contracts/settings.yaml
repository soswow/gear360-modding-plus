  - id: settings.exposure-attributes-through-libcapture-20261104
    status: accepted
    kind: static
    statement: >
      Through mm_camera_set_usr_attributes, libcapture keeps Linux ids 0, 1,
      4, 5, 16, 22 and 23 as wire ids, which the RTOS maps to DIALMODE,
      SHOOTINGMODE, ISO, WB, SMARTRANGE, ISONR and LTNR (Linux id 39 is
      ISOAUTOMAX). Value conversions: DIALMODE 1 -> native 2 (PROGRAM), 3 ->
      4; SHOOTINGMODE is shifted by libcapture (0x10000 -> 0x10001 PROGRAM,
      0x10003 -> 0x10004 MANUAL); ISO is a number (0 AUTO, 100 -> 0x50001,
      125 -> 0x50002 ...); ISONR 0x160000..3 -> 0x1e0000..3; LTNR 0/1 ->
      0x1f0000/1. The shutter is variable 0x101: mm_camera_set_var_attributes
      sends the value unchanged (wire 0x1302) and the RTOS SetVariableData
      stores it as VARIABLE_TV, the value the camera shell's setvar TV writes
      (16 * log2(1/seconds); EXIF 1/60 s for TV 95 in September 2026).
    address_space: linux-capture-elf
    also_involves: [rtos]
    evidence:
      - ev_e0ff9be24aafadfac63bb0c941827cd072cc51863322991223a6905545877909
      - ev_0443be32d774067cbe87a3b84f4fa21e53c2403e6e4db3c98ab89b2f6d06185a
      - ev_379823e9331317d56c6cebf5bd6267a8117d445904dfcf81f9953d29c807f950
      - ev_729fe2965b990d5da27e6fcae3f68e0cbf7f7739edd1dad9eb96b3b699b202df
      - ev_ef4b3d162c528f6896461db58769f23d832ccecc753be4cc20d7a0e659075aeb
      - ev_d3914fb453c77e5ad35b1c442202f537a70d033ab7c2280779917f177c1ce0eb
    not_proven:
      - that these Linux-side settings change the sensor exposure as the shell's did
      - exposures longer than about 1/5 s (September saw no further brightening)
    detail: output/decompile/rea/pass-exposure-control-20261104/RESULT.md

  - id: settings.manual-exposure-from-g360cap-observed-20261104
    status: accepted
    kind: observation
    statement: >
      g360cap set, before each of three stills, DIALMODE 3, SHOOTINGMODE
      0x10003, ISO 100 and variable 0x101 (TV 160, 96, 32). The RTOS logged
      DIALMODE_SHUTTERSPEED, SHOOTINGMODE_MANUAL, ISO_100 and SetVideoConfig
      m_uiExposureTimeStill 976, 15625 and 250000 us (exactly 2^(-TV/16) s)
      with m_iSValue 80; the Linux gyro responder logged the same exposures.
      The main JPEGs' mean levels were 2.0, 17.3 and 104.8. Setting DIALMODE
      1, SHOOTINGMODE 0x10000 and ISO 0 afterwards restored PROGRAM and
      ISO_AUTO. No reboot.
    detail: output/decompile/rea/pass-expoE1/RESULT.md

  - id: settings.five-second-exposure-selects-ltnr-recipe-then-stalls-20261104
    status: accepted
    kind: observation
    statement: >
      With RAW_SUPERFINE, LTNR on, manual mode, ISO 100 and TV -37, the RTOS
      logged ">> CMaterial_PP_Core_Still_LTNR_Image" (the long-exposure
      recipe) and SetStillConfig m_uiExposureTimeStill 4967431 us with
      m_iSValue 80, reconfigured both sensors (UD 2880x2880, EnableStream,
      SensorCb(2)) and then logged nothing more about the capture for about
      40 s: no readout, RAW work, dark frame or encode; Linux received
      capture-start and capturing only, no gyro request and no image set.
      g360cap timed out at 15 s and restored the settings; no reboot.
    not_proven:
      - whether the capture stalls or is only slow (the 15 s timeout restored settings mid-capture)
      - the sensors' longest supported still exposure
    detail: output/decompile/rea/pass-expoE2/RESULT.md

  - id: settings.quickview-holdzoom-skips-single-still-liveview-restart-20261104
    status: accepted
    kind: static
    also_involves: [linux-capture-elf]
    statement: >
      CDriveSingle::restartLiveview (FUN_80276c04) restarts live view after a
      single still through CDriveBaseNx::restartLiveview (FUN_802748e8)
      unless user setting 0x33 is 0x330005; in that case it restarts only if
      the monitor-out check FUN_8005b4b0 returns 1 (property 0x28cc == 1 and
      MONITOROUT 0x340000/1/3), the command mode byte is 0x15 (set by the
      custom-WB command FUN_800efeac; CCmdCaptureNormal FUN_800ef078 sets 1
      for a normal still), dial mode 10 is combined with smart mode
      0x51001e and flag 0x11e, or a boot shot is running
      (CBootShotManager+0x19 is 1 or 2, FUN_80570884); otherwise it returns
      0 and live view stays off until the quick-view state
      (CCaptureStateQuickview, FUN_801035f8) restarts it. Setting 0x33 is
      USERDATA_QUICKVIEWTIME; by the order of its value names (OFF, 1SEC,
      3SEC, 5SEC, HOLD, HOLDZOOM, NUM_OF_QUICKVIEWTIME) 0x330005 is
      QUICKVIEWTIME_HOLDZOOM. The RTOS attribute conversion (FUN_80052b9c,
      FUN_80543e48) maps wire attribute 0x2b with values 0x2b0000-0x2b0005
      to 0x330000-0x330005, and libcapture's user converter (Ghidra
      0x4408c) produces that wire attribute from its API attribute 0x1e
      with values 0x1e0000-0x1e0005 (its own API 0x2b becomes wire 0x39).
      Trial R1 (quick view not set)
      logged "[restartLiveview] Change to NORMAL_LIVEVIEW" from this path.
    address_space: rtos
    evidence:
      - ev_ad345c6fa264179859329ac73a95180f8221472559b461e9a13f4e356db34aab
      - ev_175cea72e8c9d7d06fc53f22ed692eb6eb71724efac10f3d764158e6d0db9717
