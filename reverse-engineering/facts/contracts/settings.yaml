  - id: settings.iso-shutter-wires
    status: accepted
    kind: static
    statement: >
      The Linux ISO handler requires 2 input bytes, zero-extends to 4, and
      sends category 0x81, attribute 0x1104, length 4. The shutter handler
      requires 4 bytes and sends category 0x81, attribute 0x1302, length 4.
      SetUserDataMCB uses (uint16)id OR 0x1100. SetVariableDataMCB uses
      (id - 0xff) OR 0x1300. Local cached-property setters do not apply hardware.
    address_space: linux-capture-elf
    not_proven:
      - physical ISO enum values
      - shutter time units
      - that a successful wire send changed the sensor
    detail: archive/INVESTIGATION_CHECKPOINT_20261019_SOFTWARE_CONTROL.md

  - id: settings.native-iso-shutter-storage
    status: accepted
    kind: static
    statement: >
      On the RTOS side, ISO is translated to native tagged id 5, checked
      against a runtime option mask, and stored as one byte. The value
      converter maps numeric 100 to 0x00050001 and 0 to 0x00050000 in a
      legacy table. Shutter native id 0x101 uses four-byte DataBox storage
      from the startup-copied length table. Successful changes notify
      observers by data id. An unchanged path may return success without
      notification. The input getter shifts the shutter by 4, and a snapshot
      truncates it to 16 bits. Reader failures can feed an initialized 0.
      Registration and read returns are ignored.
    address_space: rtos
    not_proven:
      - full hardware support for every table entry
      - physical shutter units
      - persistence across reboot
      - sensor application
    detail: archive/INVESTIGATION_CHECKPOINT_20261019_EXPOSURE_USE.md

  - id: settings.exposure-reaches-register-path
    status: accepted
    kind: static
    statement: >
      The 3A calculation can write the result model that capture reads.
      Model +32 is passed through a heap receiver into 0x803b4340. Record
      +2 and +4 are capture model +34 and +36. Native shutter participates
      in the context+14 == 2 branch, which has its own shooting and movie
      mode gates. StartAe forwarding reaches 0x80242dc8, which reads a
      selected timing object and clamps a converted quantity. 0x80242318
      submits registers 0x0202 and 0x0340 through 0x80243a04. The duration
      table base is 0x806c6478 after its negative displacement, not the
      literal 0x806c6660.
    address_space: rtos
    not_proven:
      - physical time units
      - which timing object is selected on a live capture
      - lower transport success
      - a sensor effect
    detail: archive/INVESTIGATION_CHECKPOINT_20261019_EXPOSURE_USE.md

  - id: settings.native-raw-flags-are-not-ownership
    status: accepted
    kind: static
    statement: >
      Native userdata ids ISO 5, RAW_SAVE 123, SSIF_RAW 124, RAW_BIT 125,
      and RAW_PACK 126 are a different domain from the Linux API ids.
      RAW_SAVE value 0x007b0001 also invokes a raw filepath workflow.
      Values 123 and 124 together change selected routing rows. That does
      not supply owned pixels.
    address_space: rtos
    not_proven:
      - a caller-owned RAW buffer behind those flags
    detail: archive/INVESTIGATION_CHECKPOINT_20261019_SOFTWARE_CONTROL.md

