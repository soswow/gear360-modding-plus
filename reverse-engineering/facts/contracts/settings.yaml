  - id: settings.long-exposure-capture-path-never-delivers-20261104
    status: accepted
    kind: observation
    statement: >
      Repeating the 5 s RAW_SUPERFINE still (LTNR on, ISO 100, TV -37) with a
      90 s wait gave no image set and no frame-end gyro request; the RTOS
      logged CapInit eCapOption(1), sensor modes 2 -> 5, "capExposure :
      Exposure = 4967.431ms", CapFrameReadout, set pp size1 w:0 h:0,
      EnableStream and SensorCb(2), then nothing about the capture for 90 s.
      Normal stills (E1, up to 1/4 s) instead read their frame from the
      running stream (VideoFrameReadout) and reach Raw Work Done within
      about 40 ms. So the long-exposure capture path never receives its
      frame on this camera, and the LTNR recipe route to RAW is blocked at
      5 s.
    not_proven:
      - whether the exposure length or the LTNR recipe selects the capture path
      - the longest exposure that completes
    detail: output/decompile/rea/pass-expoE3/RESULT.md

  - id: settings.still-exposure-cap-is-four-videofull-frames-20261108
    status: open
    kind: static
    statement: >
      Reading the saved RTOS decompile (not a fresh REA session): the
      sensor driver's exposure setter FUN_80242dc8 converts the requested
      microseconds to lines with a 480 MHz clock and clamps them to the
      active mode's frame lines minus 6, times 4 only for sensor modes 0x16
      (VideoFull), 0x23 and 0x24. Normal stills run in mode 0x16 at the
      24 fps rate class (19.99 M clocks, 41.7 ms per frame), so the cap is
      about 4 frames, 166 ms, 1/6 s: the plateau seen in September and the
      reason longer requested exposures give the same image. The long route
      (E3) walks sensor modes 2-6, which are not in the times-4 set and map
      to the UD mode (41.7 ms frame), so its sensor timing does not explain
      the stall; the PP windows are sized 0x0 there. The sensor driver
      picks a timing object by mode class (11 tables at 0x80674d70, 480 MHz):
      modes 2-6 are class 2, 3399 lines x 4712 clocks = 33.4 ms, which is
      the 33 ms readout seen in E3; no mode class gives more than 4 frames
      (167 ms) of exposure.
      Trial L1 (8 November, JPEG, ISO 100, LTNR off) agrees: 1/4 s and 2 s
      stills have identical mean luma (46.3), 1/8 s is darker (42.3), and 5 s
      gives the same image with the usual 0.85 s capture and no stall.
    address_space: rtos
    not_proven:
      - confirmation in a fresh REA session
      - that mode 22 is the sensor mode during a stream-grab still at capture time (E1 log shows eSensorMode 22 set before the readout)
      - how Bulb recipes realise a longer exposure
    detail: output/decompile/rea/pass-longexp-static-20261108/RESULT.md

  - id: settings.raw-scales-at-both-exposure-ends-20261108
    status: accepted
    kind: observation
    statement: >
      Trial ENDS1 (8 November, home network, same boot 1794129402, ISO 100,
      LTNR off, g360-shot RAW, one static scene, each step ending with its
      first TV again). Black-subtracted RAW signal relative to frame 1, on
      pixels unclipped and above 1-5% in all four frames: slow end TV 41,
      57, 73 (requested 1/5.9, 1/11.8, 1/23.6 s) gave 1, 0.510, 0.256 and
      the repeat 0.998 (expected 0.5, 0.25): each step halves the signal,
      and TV 41 exposes about 166 ms rather than the requested 169 ms, the
      4-frame cap. Fast end TV 186, 202, 218 (1/3158, 1/6317, 1/12634 s)
      gave 1, 0.493, 0.239 and the repeat 1.008, the same at 1% and 2%
      thresholds: halving too, consistent with every exposure being about
      5 us shorter than requested, and TV 218 (at the ~1/12,400 s floor) is a
      real, proportionally shorter exposure. Exif ExposureTime read 1/6, 1/13,
      1/25 and 1/3200, 1/6400, 1/13000. Trial ENDS2 repeated the fast step
      with about 2.4 times the light (8,599 pixels above 5%, 49,320 above
      2%): 1, 0.494, 0.238, repeat 1.001 (0.491, 0.241 at 2%), so the
      shortfall is reproducible and independent of signal level (a time
      offset of about 4-5.5 us, not a sensor nonlinearity).
    not_proven:
      - the cause of the ~5 us shortfall (fixed offset in the line count, or a slightly different line time)
      - linearity between the ends (only 1 EV steps at each end were measured)
    detail: output/decompile/rea/pass-longexp-static-20261108/RESULT.md
  - id: settings.raw-follows-set-time-not-exif-name-20261109
    status: accepted
    kind: observation
    statement: >
      Trial RANGE14 (9 November, home network, same boot 1794129402, ISO 100,
      LTNR off, g360-shot RAW, a static scene with dark and bright parts): 14
      TVs 0.85 EV apart from 41 to 218 and a repeat of 41 (ratio 1.0000).
      Chained neighbour ratios (pixels chosen on an independent third frame)
      against each model scaled by one free constant: the set time
      2^(-TV/16) fits to 0.034 EV RMS (worst 0.088 at TV 218); the same with
      the 166 ms cap and a 5 us shortfall, both from earlier trials and not
      fitted here, fits to 0.013 EV RMS (worst 0.031); the firmware's Exif
      ExposureTime (third-stop names such as 1/30 for 1/34.9 s) fits to only
      0.083 EV RMS, worst 0.157, with single-step errors up to 0.29 EV.
      Within each pair the ratio holds within 1% from 6% to 85% of the RAW
      range. The Exif ExposureTime both writers copy from the firmware's
      capture record is a rounded name, not the exposure.
    not_proven:
      - absolute exposure time (only ratios were measured)
      - the cause of the 0.3-1% lower ratio in the dimmest pixels (black level?)
    detail: output/decompile/rea/pass-longexp-static-20261108/RESULT.md
