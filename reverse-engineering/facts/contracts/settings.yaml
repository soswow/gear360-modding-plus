# Exposure and capture settings. Native RTOS ids and Linux wire ids are
# different domains. Do not copy one numbering into the other.

claims:
  - id: settings.drive-to-first-image-selector
    status: accepted
    kind: static
    statement: >
      Composer801358c8 reads decimal key10 through80084cfc using the pointer
      at object+0x08, then stores one byte at object+0x49. Native inputs 0xa0001/0xa0006/0xa0007 use four ordered predicates
      to choose0x0a/0x0b/0x0d/0x10 or0; 0xa0002/0xa0003 map to1/2; 0xa0004 maps to3/4 by
      predicate; 0xa0005/0xa0008/0xa0009/0xa000a/0xa000b map to5/6/7/8/9. Other inputs map to0.
      Then byte+0x31 equal0x24 overrides to0x11; byte+0x30 equal0x15 overrides last to0x0c.
      Therefore the 0xa0001/0xa0006/0xa0007 family always produces a value outside signed
      1/2, regardless of those predicate results or these overrides. If that
      composed byte reaches the checked encoded builder unchanged and byte+0x48
      exceeds3, its consumer selects material0x14000/fallback0x14001 lookup.
      Inputs0xa0002/0xa0003 select the supplied-image arm only without an override.
      Ordinary argument12 remains null, so that arm skips first-image setup.
      This identifies a static native-drive source/gate, not an active sheet
      instance or a demonstrated RAW setting.
    address_space: rtos
    evidence:
      - ev_d6d268ee64f9e99da3b21cf42aa7a4bfbda5dc3db440f6bbab97c1c0b891bee0
      - ev_89910daa21596f22bea295bcda9a6c84479a4b7c72c19595f66e9c7e3ce9a529
      - ev_fe887146004fbd4a5ef1d63479b30dfc429c05813948cc9d8cd9ecb568e78df5
    not_proven:
      - predicate mode meanings, current native input, sheet identity or absence of later field writes
      - complete Linux setting-to-selected-instance binding or initialized setting object
      - nonzero image backing, physical sensor samples, extent or retained ownership
    detail: output/decompile/rea/pass-base-lrc-20261026/parent-review.md

