  - id: settings.drive-selects-capture-type-and-recipe-20261104
    status: accepted
    kind: static
    statement: >
      The RTOS order-sheet composer FUN_80134ee0 writes the capture type at
      sheet +0x30 from USERDATA_DRIVE: CONTI 0xa0002-0xa0004 -> 0x13, BURST
      0xa0005 -> 4, ADJUST 0xa0007 -> 0x11, AEBRK 0xa0008 -> 5, WBBRK 0xa0009
      -> 6, PWBRK 0xa000a -> 0xa, DEPTHBRK 0xa000b -> 9, TIMELAPSE 0xa000c ->
      0x23, otherwise 1 (with a few special cases). getRecipeBookId
      (FUN_80281460) maps a still's capture type to a recipe id: 5, 9 and
      0x24 -> 0; 6 and 0xa -> 10 (8 for a long exposure); 4 -> 1; 0x11 ->
      0x11; 1 -> 8 for a long exposure, else from the drive selector +0x49
      and other sheet fields (0, 4, 6, 0x14, 0x15, 0x1b or 0x20). The
      registration FUN_80280920 maps ids 0 and 4 to the normal recipe
      0x802a9570, 5 to HDR 0x802a6cec, 10 to RecipeBracket 0x802aee04, 11 to
      RecipeBracketBackEnd, 13 to best face, 15 to RecipeMultiExp. So
      DRIVE_WBBRK and DRIVE_PWBRK select RecipeBracket, and DRIVE_SINGLE and
      DRIVE_AEBRK the normal recipe.
    address_space: rtos
    evidence:
      - ev_d3242ad0beaa2cec225acf6e22e5b70c0fabf17143fbfec4bca6c9f7fa81c04f
      - ev_cf01e4a0ae2b18a5ecee355f50feeac01f307fb766980e817eb8020a9f1068ad
      - ev_e95d4baf0db8bb281a191fe424239e935ca8287ca26b9e02ba4b2fbe6a43debf
      - ev_77ca5b1b51e1d22df93cd38e4bd3983ae079e12ed9c8dc8415e929f28aa55315
    not_proven:
      - that RecipeBracket works on the Gear 360's dual-lens still pipeline
      - the live values of the other sheet fields on this camera
    detail: output/decompile/rea/pass-drive-recipe-20261104/RESULT.md

