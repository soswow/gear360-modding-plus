  - id: settings.raw-quality-override-is-prosuggest-sample-capture-20261104
    status: accepted
    kind: static
    statement: >
      The RTOS order-sheet writer 0x801357b0 forces sheet byte 3 when
      FUN_80084c04(sheet+8, 0x134) returns nonzero. That getter selects the
      table by the key's high byte (1, variable data) and returns -1 when the
      key's type query is 5 or more or the read fails, else the stored
      value. By the RTOS name-table order (VARIABLE_TV at index 1 = native
      0x101, the known shutter id), variable entry 0x34 is
      VARIABLE_PROSUGGEST_SAMPLE_CAPTURE. So a RAW native quality reaches
      the sheet (0x40004 -> byte 4 -> set type 3; 0x40003 -> 8 -> set type
      2) unless that flag is set or unreadable.
    address_space: rtos
    evidence:
      - ev_f6151363fe0b8ae4727a550d9858eaaf87e280b4f8014749c8ea84362ae6ecc9
      - ev_95a3659d3d693b119aac87b9caa586bd6bb69244a4c7174de3c722bed740ea8b
    not_proven:
      - the flag's live value, or that the name-table order equals the id order
      - that the user-data store accepts a RAW value on this camera
    detail: output/decompile/rea/pass-raw-quality-route-20261104/RESULT.md

