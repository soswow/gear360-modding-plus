  - id: settings.order-sheet-configuration-writer
    status: accepted
    kind: static
    statement: >
      RTOS801357b0 reads80084cfc(sheet+8,4), initializing a local byte to0
      and mapping values0x40000..0x40007 respectively to1,2,3,8,4,5,6,7.
      It then calls80084c04(sheet+8,0x134) (corrected 4 November 2026: the
      key is hexadecimal 0x134, variable data, not decimal 134); any nonzero return overrides
      that byte to3. The final ARM strb at801358b4 stores it at sheet+48.
      The override is not simply a boolean setting:80084c04 defaults its
      return toffffffff and also returns that on failed lookup, so a
      failure takes the same override branch. Getter80132f80 reads this
      byte; its value greater than3 gates optional-image setup in the
      checked encoded builder. These are static dataflow edges only.
