  - id: submit.forty-eight-byte-request
    status: accepted
    kind: static
    statement: >
      CaptureStillImage accepts command, buffer, and length. The normal
      still packet is 48 bytes with command 0x01010001. The adapter command
      is 0x201 and the bridge command is 0x83. The caller supplies the
      storage count and free-space bytes. still_request_encode writes those
      48 bytes. still_request_dispatch calls the caller-supplied submit
      function once. The return is send status. CSender::Send may return -1
      and still queue the command. Do not retry automatically.
    address_space: linux-capture-elf
    code: src/lib/still-request/still_request.h
    not_proven:
      - capture completion
      - a RAW result
    detail: archive/INVESTIGATION_CHECKPOINT_20261019_CAPTURE_API.md

