  - id: submit.capture-still-bracket-words-20261104
    status: accepted
    kind: static
    statement: >
      libcapture mm_camera_capture_still (0x3aa7c) converts mm capture type 6
      to command 0x1010006 (WB bracket) and then requires word 13 in
      0x1a0000-0x1a0005 (step 3, 2, 1, 3, 2, 1) and word 14 equal to 1 or 2
      (axis), else returns -3 before sending; words 11 and 12 pass through.
      For 0x1010005 (AE bracket) word 11 selects the order 0x180000-0x180003
      and word 12 the step 0x190000-0x19000e, with defaults. The stock app's
      UI_Mm_Camera_Set_Capture_Wbb_Param (0x11a9bc) fills these words but has
      no caller; UI_Mm_Camera_Start_Capture sends words 11-14 from globals
      0x33a208-0x33a214. Observed in step 5c: capture type 6 with zero words
      returned -3 and no command reached the RTOS.
