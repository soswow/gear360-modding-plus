  - id: rejected.size-bank-echo-as-exclusive-allocation-proof
    status: rejected
    kind: inference
    statement: >
      The8315d77 lease helper labels any0x81/0x018c reply with matching
      words2/3 as ours and overwrites its saved address on every match.
      Size/bank echoes alone do not distinguish concurrent or stale
      requests and do not establish authority to release the address.
      The passive modulo-ring copy also lacks immutable-copy ownership
      and full-lap detection. This rejects the association proof, not the
      source-bound existence of the allocation request.
    detail: output/decompile/rea/pass-8315d77-review-20261023/parent-review.md

  - id: rejected.opaque-object-comparison-as-sensor-binding-proof
    status: rejected
    kind: inference
    statement: >
      The8315d77 probe compares an allocation with words in the context
      named by0x81/0x0201 and calls offset0x84 its plane. That event carries
      an image-set context pointer, without a demonstrated plane layout
      or lease. Different pointer-looking words do not settle whether a
      supported sensor destination/export exists. A64MiB allocation in
      DebugStartStill360 does not by itself identify the normal still's
      sensor-plane size or binding. Generic CCapImage RAW methods likewise
      do not establish that a selected callback produces sensor samples.
    detail: output/decompile/rea/pass-8315d77-review-20261023/parent-review.md

