  - id: rejected.rtos-log-is-readable-through-the-preference-window
    status: rejected
    kind: inference
    statement: >
      The inference that the RTOS's LogBuffer_SendPrintEx destination
      0x81c11c3c lies inside the shared-memory region the capture library's
      preference mapping exposes to Linux, and that the RTOS's failure lines
      would therefore be readable from Linux through that window, is false.
      The preference window's RTOS base is 0x85400000, not 0x81b00000, so
      0x81c11c3c is 0x38EE3C4 below the window and not at offset 0x11c3c;
      the live window carries no printable text at all and does not change
      over half a second; the capture library's virtual-address window
      covers physical 0xa6000000..0xc0000000 and does not reach it; and the
      stock application's own /dev/mem mappings do not cover it. Direct
      /dev/mem reads are refused by this kernel, so the library's mapping is
      the only working read path into that region. Do not resume a log
      probe against the preference window and do not plan a still-trial poll
      loop on that window.
    address_space: linux-shared-window
    detail: output/decompile/rea/pass-log-read-probe-20261102/LOG-READ-PROBE-RESULT.md

