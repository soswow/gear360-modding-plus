  - id: rejected.passive-ring-observation-as-owned-completion-proof
    status: rejected
    kind: inference
    statement: >
      A passive producer-cursor observer does not close the receiver race
      merely because the stock consumer leaves bytes in place. That
      consumer can release them for overwrite while the observer copies.
      Equal modulo cursors hide a full revolution; matching frame length
      and category/attribute do not distinguish generations or callers.
      The historical observed packets remain useful evidence, but the
      inference that this supplies reliable owned completion is withdrawn.
    detail: output/decompile/rea/pass-minimax-review-20261023/parent-review.md

